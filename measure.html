<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>度尺寶 Pro - 雲端安全版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Firebase SDK (包含 App、Firestore 及 Auth 匿名安全認證) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        [v-cloak] { display: none !important; }
        * { box-sizing: border-box; }
        
        /* 根治手機爆畫面：嚴格鎖死動態視口 100dvh */
        html, body { 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%; height: 100dvh;
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: #000;
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none;
            user-select: none;
        }

        /* 強制所有輸入框字體 >= 16px，徹底杜絕 iOS Safari 自動放大頁面導致錯位 */
        input, select, textarea {
            font-size: 16px !important;
        }

        .touch-scrollable {
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }

        .micro-btn { 
            padding: 3px 6px; 
            font-size: 13px; 
            font-weight: bold; 
            line-height: 1.2; 
            border: 1px solid #4b5563; 
            border-radius: 3px; 
            white-space: nowrap; 
            background: #ffffff; 
            color: #000000; 
        }
        .micro-btn:active { background: #000000; color: #ffffff; }

        /* 5px 黑描邊純文字印章（徹底無框、零遮擋底圖細節） */
        .stamp-text {
            font-weight: 900;
            font-size: 28px;
            paint-order: stroke fill;
            stroke: #000000;
            stroke-width: 5px;
            stroke-linejoin: round;
            stroke-linecap: round;
            user-select: none;
        }
    </style>
</head>
<body class="text-gray-100 font-sans antialiased">
    <div id="app" v-cloak class="fixed inset-0 w-full h-full flex flex-col overflow-hidden">
        
        <!-- 頂部導航列 (44px 嚴格固定高度) -->
        <header class="h-11 shrink-0 bg-black text-white px-2 border-b border-gray-800 flex justify-between items-center z-30">
            <div class="flex items-center gap-1.5 truncate flex-1 mr-1">
                <span :class="cloudStatusClass" class="text-[10px] px-1.5 py-0.5 rounded font-mono font-bold shrink-0">
                    {{ cloudStatusText }}
                </span>
                <h1 class="text-xs font-bold truncate">
                    <span v-if="currentView === 'projects'">工程存檔目錄</span>
                    <span v-else-if="currentView === 'plan'">{{ project.name || '未命名工程' }} - 平面圖</span>
                    <span v-else-if="currentView === 'photo'">{{ activePin.name || '相片標註' }}</span>
                </h1>
            </div>
            
            <div class="flex gap-1 items-center shrink-0">
                <button v-if="currentView === 'projects'" @click="syncCloudProjects" class="bg-gray-800 active:bg-gray-700 px-2 py-1 rounded text-xs font-bold border border-gray-600">
                    同步雲端
                </button>
                <button v-if="currentView === 'projects'" @click="createNewProject" class="bg-blue-600 active:bg-blue-800 text-white px-2.5 py-1 rounded text-xs font-bold border border-blue-400">
                    新建工程
                </button>

                <button v-if="currentView === 'plan' && pins.length > 0" @click="exportPdfReport" class="bg-blue-600 active:bg-blue-800 text-white px-2 py-1 rounded text-xs font-bold border border-blue-400">
                    匯出 PDF
                </button>
                <button v-if="currentView === 'plan'" @click="backToProjects" class="bg-gray-800 active:bg-gray-700 px-2 py-1 rounded text-xs font-bold border border-gray-600">
                    工程目錄
                </button>

                <button v-if="currentView === 'photo' && activePin.photo" @click="exportSingleImage" class="bg-green-700 active:bg-green-800 text-white px-2 py-1 rounded text-xs font-bold border border-green-500">
                    下載相片
                </button>
                <button v-if="currentView === 'photo'" @click="handleDeletePin" :class="deleteConfirm ? 'bg-red-600 border-red-400' : 'bg-red-900 border-red-700'" class="text-white px-2 py-1 rounded text-xs font-bold border">
                    {{ deleteConfirm ? '確認刪除?' : '刪除釘位' }}
                </button>
                <button v-if="currentView === 'photo'" @click="currentView = 'plan'" class="bg-gray-800 active:bg-gray-700 px-2 py-1 rounded text-xs font-bold border border-gray-600">
                    回平面圖
                </button>
            </div>
        </header>

        <!-- 第 1 級：工程存檔目錄 (雲端自動同步清單) -->
        <main v-show="currentView === 'projects'" class="flex-1 min-h-0 bg-gray-900 p-3 overflow-y-auto touch-scrollable">
            <div v-if="projectList.length === 0" class="text-center text-gray-400 mt-16 text-sm font-bold">
                目前沒有任何工程存檔，點擊右上角「新建工程」開始。
            </div>
            <div v-for="proj in projectList" :key="proj.id" class="bg-black border border-gray-700 p-3 rounded mb-3 flex justify-between items-center shadow-lg">
                <div class="flex-1 mr-2" @click="loadProject(proj.id)">
                    <div class="font-bold text-base text-white truncate">{{ proj.name || '未命名工程' }}</div>
                    <div class="text-xs text-gray-400 mt-1">日期: {{ proj.date }} | 記錄點: {{ proj.pinCount }} 個</div>
                </div>
                <div class="flex gap-2 shrink-0">
                    <button @click="loadProject(proj.id)" class="bg-gray-700 text-white px-3 py-1.5 rounded text-xs font-bold">開啟</button>
                    <button @click="deleteProject(proj.id)" class="bg-red-900 text-white px-3 py-1.5 rounded text-xs font-bold border border-red-700">刪除</button>
                </div>
            </div>
        </main>

        <!-- 第 2 級：平面圖打釘定位 -->
        <main v-show="currentView === 'plan'" class="flex-1 min-h-0 bg-gray-900 flex flex-col overflow-hidden">
            <div class="w-full bg-black border-b border-gray-700 p-2 flex gap-2 items-center shrink-0">
                <span class="text-xs font-bold text-gray-400 whitespace-nowrap">單位:</span>
                <input type="text" v-model="project.name" @blur="saveCurrentProject" placeholder="輸入工程單位名稱" class="flex-1 bg-gray-800 text-white border border-gray-600 text-sm px-2 py-1 rounded font-bold focus:outline-none">
                <span class="text-xs font-bold text-gray-400">{{ project.date }}</span>
            </div>

            <div v-if="!planImage" class="flex-1 flex items-center justify-center p-4">
                <label class="bg-white text-black px-6 py-3 rounded text-sm font-bold cursor-pointer inline-block border-2 border-black active:bg-gray-200">
                    拍照 / 匯入平面圖
                    <input type="file" accept="image/*" class="hidden" @change="e => handleImageUpload(e, 'plan')">
                </label>
            </div>
            
            <div v-else class="flex-1 min-h-0 relative overflow-auto p-2 flex items-center justify-center touch-scrollable" @click="addPinOnPlan">
                <div class="relative inline-block max-w-full max-h-full">
                    <img :src="planImage" class="max-w-full max-h-[78dvh] object-contain block border border-gray-700">
                    <div v-for="(pin, index) in pins" :key="pin.id" 
                         class="absolute w-8 h-8 -ml-4 -mt-8 flex flex-col items-center justify-center cursor-pointer"
                         :style="{ left: pin.x + '%', top: pin.y + '%' }"
                         @click.stop="openPin(pin)">
                        <div class="bg-red-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white shadow">
                            {{ index + 1 }}
                        </div>
                        <div class="w-0 h-0 border-l-[6px] border-r-[6px] border-t-[8px] border-l-transparent border-r-transparent border-t-red-600 -mt-[2px]"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- 第 3 級：相片標註畫板 (物理夾鉗自適應 + 懸浮防遮擋拖曳) -->
        <main v-show="currentView === 'photo'" ref="workspace" class="flex-1 min-h-0 relative bg-black overflow-hidden flex flex-col items-center justify-center">
            
            <div v-if="activePin && activePin.photo" class="absolute top-2 z-20 flex gap-1 bg-black/85 backdrop-blur p-1 rounded border border-gray-700 shadow-lg">
                <button @click="drawMode = 'line'" :class="drawMode === 'line' ? 'bg-white text-black' : 'bg-black text-white'" class="px-3 py-1 text-xs font-bold rounded">拉線</button>
                <button @click="drawMode = 'freehand'" :class="drawMode === 'freehand' ? 'bg-white text-black' : 'bg-black text-white'" class="px-3 py-1 text-xs font-bold rounded">塗鴉</button>
                <button v-if="activePin.paths && activePin.paths.length" @click.stop="undoPath" class="bg-gray-800 text-white px-2 py-1 text-xs font-bold rounded border border-gray-600 ml-1">復原</button>
            </div>

            <div v-if="activePin && !activePin.photo" class="flex-1 flex items-center justify-center p-4">
                <label class="bg-white text-black px-6 py-3 rounded text-sm font-bold cursor-pointer inline-block border-2 border-black active:bg-gray-200">
                    拍攝現場相片
                    <input type="file" accept="image/*" class="hidden" @change="e => handleImageUpload(e, 'photo')">
                </label>
            </div>

            <div v-else-if="activePin && activePin.photo" 
                 :style="wrapperStyle" 
                 class="select-none touch-none">
                
                <!-- 底層原生相片 (等比例填滿，零變形，絕不爆邊) -->
                <img :src="activePin.photo" class="w-full h-full block pointer-events-none select-none object-fill">

                <!-- 頂層全透明 SVG 畫板 (1:1 投影原始相片解析度) -->
                <svg ref="svgCanvas"
                     class="absolute inset-0 w-full h-full select-none touch-none"
                     :viewBox="`0 0 ${activePin.photoW || 1200} ${activePin.photoH || 900}`"
                     preserveAspectRatio="none"
                     @touchstart="handleTouchStart" @touchmove="handleTouchMove" @touchend="handleTouchEnd"
                     @mousedown="handleTouchStart" @mousemove="handleTouchMove" @mouseup="handleTouchEnd">
                    
                    <path v-for="path in (activePin.paths || [])" :key="path.id" :d="path.d" stroke="#ff0044" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <line v-for="line in (activePin.lines || [])" :key="line.id" :x1="line.x1" :y1="line.y1" :x2="line.x2" :y2="line.y2" stroke="#ff0044" stroke-width="5" stroke-linecap="round" />

                    <path v-if="currentPath" :d="currentPath" stroke="#ff0044" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    <line v-if="currentLine" :x1="currentLine.x1" :y1="currentLine.y1" :x2="currentLine.x2" :y2="currentLine.y2" stroke="#ff0044" stroke-width="5" stroke-dasharray="8" />

                    <!-- 印章與尺寸：純文字 + 5px 黑描邊 + 懸浮防遮擋拖曳 -->
                    <g v-for="marker in activePin.markers" :key="marker.id"
                       :transform="`translate(${marker.x}, ${marker.y})`"
                       class="cursor-move"
                       @touchstart.stop.prevent="e => startDrag(marker, e)"
                       @mousedown.stop.prevent="e => startDrag(marker, e)">
                        
                        <text text-anchor="middle" dominant-baseline="central"
                              :fill="getStampColor(marker)"
                              class="stamp-text">
                            <tspan v-for="(line, idx) in getMarkerLines(marker)" :key="idx" x="0" :dy="idx === 0 ? (getMarkerLines(marker).length > 1 ? '-0.6em' : '0') : '1.2em'">
                                {{ line }}
                            </tspan>
                        </text>
                    </g>
                </svg>
            </div>
        </main>

        <!-- 遮罩背景 (點擊背景即可自動保存退出抽屜) -->
        <div v-if="showBottomSheet && activeMarker" 
             class="fixed inset-0 bg-black/60 z-40" 
             @click="closeBottomSheet"></div>

        <!-- 懸浮抽屜：標籤設定 (頂部固定確認按鈕，鍵盤彈出絕不遮擋) -->
        <div v-if="showBottomSheet && activeMarker" 
             class="fixed inset-x-2 bottom-2 max-h-[82dvh] bg-white text-black border-2 border-black rounded-lg z-50 flex flex-col shadow-2xl overflow-hidden touch-scrollable">
            
            <div class="p-2 bg-gray-900 text-white flex justify-between items-center border-b border-gray-700 shrink-0">
                <span class="font-bold text-xs text-yellow-400">標註設定 (點擊外部或按確定)</span>
                <div class="flex gap-2">
                    <button @click="deleteMarker" class="bg-red-700 active:bg-red-800 text-white font-bold px-3 py-1 rounded text-xs border border-red-500">刪除標籤</button>
                    <button @click="closeBottomSheet" class="bg-green-600 active:bg-green-700 text-white font-bold px-4 py-1 rounded text-xs border border-green-400 shadow">確定完成</button>
                </div>
            </div>

            <div class="p-1 border-b border-gray-200 flex gap-1 overflow-x-auto bg-gray-100 shrink-0">
                <button @click="activeMarker.type = 'general'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'general' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">尺寸</button>
                <button @click="activeMarker.type = 'door'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'door' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">門洞</button>
                <button @click="activeMarker.type = 'window'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'window' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">窗</button>
                <button @click="activeMarker.type = 'beam'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'beam' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">樑</button>
                <button @click="activeMarker.type = 'column'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'column' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">柱</button>
                <button @click="activeMarker.type = 'stamp'; updateMarkerSize(activeMarker)" :class="activeMarker.type === 'stamp' ? 'bg-black text-white' : 'bg-white text-black'" class="micro-btn">印章</button>
            </div>
            
            <div class="p-2 overflow-y-auto bg-white flex-1 touch-scrollable">
                <!-- 12 款地盤專用印章庫 -->
                <div v-if="activeMarker.type === 'stamp'" class="flex flex-col gap-2">
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="text-[11px] font-bold text-red-700 bg-red-100 px-1 border border-red-300 rounded">瑕疵打拆</span>
                        <button v-for="stamp in ['需清拆', '牆身斜', '牆體不平整', '局部凸出']" :key="stamp" @click="applyStamp(stamp)" class="micro-btn border border-red-600 text-red-700 font-bold px-2 py-1">{{ stamp }}</button>
                    </div>
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="text-[11px] font-bold text-yellow-800 bg-yellow-100 px-1 border border-yellow-300 rounded">水電收口</span>
                        <button v-for="stamp in ['開關', '插座', '地腳線']" :key="stamp" @click="applyStamp(stamp)" class="micro-btn border border-yellow-600 text-yellow-900 font-bold px-2 py-1">{{ stamp }}</button>
                    </div>
                    <div class="flex items-center gap-1 flex-wrap">
                        <span class="text-[11px] font-bold text-blue-700 bg-blue-100 px-1 border border-blue-300 rounded">動線結構</span>
                        <button v-for="stamp in ['留通道', '開門方向', '可保留', '待確認', '實地台']" :key="stamp" @click="applyStamp(stamp)" class="micro-btn border border-blue-600 text-blue-800 font-bold px-2 py-1">{{ stamp }}</button>
                    </div>
                </div>

                <!-- 門洞/窗/樑/柱組合標籤 -->
                <div v-else-if="['window', 'door', 'beam', 'column'].includes(activeMarker.type)">
                    <div class="grid grid-cols-3 gap-2">
                        <div v-for="field in getTagFields(activeMarker.type)" :key="field.key" class="flex flex-col">
                            <label class="text-xs font-bold text-gray-700 bg-gray-200 px-1 py-0.5">{{ field.label }}</label>
                            <input type="number" v-model="activeMarker.data[field.key]" @input="updateMarkerSize(activeMarker)" @keyup.enter="closeBottomSheet" class="w-full border-2 border-black p-1 text-base font-bold bg-white text-black text-center focus:outline-none rounded">
                        </div>
                    </div>
                    <button @click="closeBottomSheet" class="w-full mt-3 bg-black text-white font-bold py-2 rounded text-sm active:bg-gray-800">確定完成</button>
                </div>

                <!-- 尺寸數值標籤 -->
                <div v-else class="flex flex-col gap-2">
                    <div class="flex gap-1 overflow-x-auto pb-1">
                        <span class="text-xs font-bold bg-gray-200 px-1.5 py-1 rounded shrink-0 flex items-center">基礎</span>
                        <button v-for="w in ['高','闊','總高','總深','腰墨','牆厚']" :key="w" @click="activeMarker.data.name = w; updateMarkerSize(activeMarker)" class="micro-btn">{{ w }}</button>
                    </div>
                    <div class="flex gap-1 overflow-x-auto pb-1">
                        <span class="text-xs font-bold bg-gray-200 px-1.5 py-1 rounded shrink-0 flex items-center">水電</span>
                        <button v-for="w in ['制中','制邊-牆','制底-地','喉邊-牆','喉底-地']" :key="w" @click="activeMarker.data.name = w; updateMarkerSize(activeMarker)" class="micro-btn">{{ w }}</button>
                    </div>
                    <div class="flex items-stretch gap-2 mt-1">
                        <input type="text" v-model="activeMarker.data.name" @input="updateMarkerSize(activeMarker)" class="w-20 border-2 border-black p-1 text-base font-bold bg-white focus:outline-none rounded text-center" placeholder="名稱">
                        <span class="font-bold self-center text-lg">:</span>
                        <input type="number" v-model="activeMarker.data.val" @input="updateMarkerSize(activeMarker)" @keyup.enter="closeBottomSheet" class="flex-1 border-2 border-black p-1 px-2 text-xl font-bold bg-white text-black focus:outline-none rounded" placeholder="數值 (mm)">
                        <button @click="closeBottomSheet" class="bg-black text-white font-bold px-4 rounded text-sm active:bg-gray-800">確定</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 匯出中指示遮罩 -->
        <div v-if="isProcessing" class="fixed inset-0 z-[100] bg-black/85 flex flex-col items-center justify-center text-white font-bold">
            <div class="w-10 h-10 border-4 border-white border-t-transparent rounded-full animate-spin mb-3"></div>
            <p class="text-base">{{ processingText }}</p>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted, nextTick } = Vue;
        localforage.config({ name: 'SiteMeasurePro', storeName: 'projects_store' });

        // Firebase 初始化與靜默匿名授權
        const firebaseConfig = {
            apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
            authDomain: "gen-lang-client-0208380044.firebaseapp.com",
            databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
            projectId: "gen-lang-client-0208380044",
            storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
            messagingSenderId: "17077391191",
            appId: "1:17077391191:web:f167a311052c56bd3d7812"
        };

        let db = null;
        try {
            if (window.firebase) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();

                // 背景自動換發匿名授權權杖，免帳號密碼且合規安全
                firebase.auth().signInAnonymously().catch(err => {
                    console.error("Firebase 匿名授權失敗:", err);
                });
            }
        } catch(e) {
            console.error("Firebase 初始化失敗:", e);
        }

        createApp({
            setup() {
                const currentView = ref('projects');
                const projectList = ref([]);
                const project = reactive({ id: '', name: '', date: '' });
                const planImage = ref(null);
                const pins = ref([]);
                const activePin = ref(null);

                const cloudSyncState = ref('ready'); // ready, syncing, error
                const cloudStatusText = computed(() => {
                    if (cloudSyncState.value === 'syncing') return '☁️ 同步中...';
                    if (cloudSyncState.value === 'error') return '☁️ 離線模式';
                    return '☁️ 雲端已連線';
                });
                const cloudStatusClass = computed(() => {
                    if (cloudSyncState.value === 'syncing') return 'bg-yellow-800 text-yellow-200 border border-yellow-600';
                    if (cloudSyncState.value === 'error') return 'bg-gray-800 text-gray-400 border border-gray-600';
                    return 'bg-green-900 text-green-300 border border-green-600';
                });

                const drawMode = ref('line');
                const showBottomSheet = ref(false);
                const activeMarker = ref(null);
                const deleteConfirm = ref(false);
                const isProcessing = ref(false);
                const processingText = ref('');

                // 物理夾鉗
                const workspace = ref(null);
                const svgCanvas = ref(null);
                const wsW = ref(window.innerWidth || 360);
                const wsH = ref((window.innerHeight || 600) - 44);

                const updateWorkspaceSize = () => {
                    if (workspace.value) {
                        const rect = workspace.value.getBoundingClientRect();
                        if (rect.width > 20 && rect.height > 20) {
                            wsW.value = rect.width;
                            wsH.value = rect.height;
                        }
                    }
                };

                const wrapperStyle = computed(() => {
                    if (!activePin.value || !activePin.value.photo) return { display: 'none' };
                    const pw = activePin.value.photoW || 1200;
                    const ph = activePin.value.photoH || 900;
                    
                    const availW = Math.max(50, wsW.value - 12);
                    const availH = Math.max(50, wsH.value - 12);
                    const photoRatio = pw / ph;
                    const availRatio = availW / availH;

                    let finalW, finalH;
                    if (photoRatio > availRatio) {
                        finalW = availW;
                        finalH = availW / photoRatio;
                    } else {
                        finalH = availH;
                        finalW = availH * photoRatio;
                    }

                    return {
                        width: `${Math.floor(finalW)}px`,
                        height: `${Math.floor(finalH)}px`,
                        position: 'relative',
                        margin: 'auto'
                    };
                });

                // 繪圖與懸浮防遮擋拖曳
                const isDrawing = ref(false);
                const startPos = ref({ x: 0, y: 0 });
                const currentLine = ref(null);
                const currentPath = ref("");
                let tempPoints = [];

                const draggedMarker = ref(null);
                const dragOrigin = ref({ x: 0, y: 0 });
                const markerOrigin = ref({ x: 0, y: 0 });
                const isDraggingMarker = ref(false);

                const getCoords = (e) => {
                    if (!svgCanvas.value) return { x: 0, y: 0 };
                    const rect = svgCanvas.value.getBoundingClientRect();
                    const cx = e.touches ? e.touches[0].clientX : e.clientX;
                    const cy = e.touches ? e.touches[0].clientY : e.clientY;
                    const pw = activePin.value.photoW || 1200;
                    const ph = activePin.value.photoH || 900;

                    let rx = (cx - rect.left) / rect.width;
                    let ry = (cy - rect.top) / rect.height;
                    rx = Math.max(0, Math.min(1, rx));
                    ry = Math.max(0, Math.min(1, ry));

                    return { x: Math.round(rx * pw), y: Math.round(ry * ph) };
                };

                const startDrag = (marker, e) => {
                    draggedMarker.value = marker;
                    const p = getCoords(e);
                    dragOrigin.value = { x: p.x, y: p.y };
                    markerOrigin.value = { x: marker.x, y: marker.y };
                    isDraggingMarker.value = false;
                };

                const handleTouchStart = (e) => {
                    if (showBottomSheet.value || draggedMarker.value || (e.touches && e.touches.length > 1)) return;
                    isDrawing.value = true;
                    startPos.value = getCoords(e);

                    if (drawMode.value === 'line') {
                        currentLine.value = { x1: startPos.value.x, y1: startPos.value.y, x2: startPos.value.x, y2: startPos.value.y };
                    } else {
                        tempPoints = [[startPos.value.x, startPos.value.y]];
                        currentPath.value = `M ${startPos.value.x} ${startPos.value.y}`;
                    }
                };

                const handleTouchMove = (e) => {
                    if (draggedMarker.value) {
                        e.preventDefault();
                        const p = getCoords(e);
                        const dist = Math.hypot(p.x - dragOrigin.value.x, p.y - dragOrigin.value.y);
                        
                        // 超過 6px 判定為拖曳，文字懸浮於手指上方 28px（防遮擋）
                        if (dist > 6) {
                            isDraggingMarker.value = true;
                            const rect = svgCanvas.value ? svgCanvas.value.getBoundingClientRect() : { height: 500 };
                            const ph = activePin.value.photoH || 900;
                            const photoOffsetY = Math.round((28 / rect.height) * ph);
                            
                            draggedMarker.value.x = p.x;
                            draggedMarker.value.y = Math.max(20, p.y - photoOffsetY);
                        }
                    } else if (isDrawing.value) {
                        e.preventDefault();
                        const p = getCoords(e);
                        if (drawMode.value === 'line') {
                            currentLine.value.x2 = p.x; currentLine.value.y2 = p.y;
                        } else {
                            tempPoints.push([p.x, p.y]);
                            currentPath.value = `M ${tempPoints.map(pt => `${pt[0]} ${pt[1]}`).join(' L ')}`;
                        }
                    }
                };

                const handleTouchEnd = (e) => {
                    if (draggedMarker.value) {
                        if (!isDraggingMarker.value) {
                            draggedMarker.value.x = markerOrigin.value.x;
                            draggedMarker.value.y = markerOrigin.value.y;
                            openBottomSheet(draggedMarker.value);
                        } else {
                            saveCurrentProject();
                        }
                        draggedMarker.value = null;
                        isDraggingMarker.value = false;
                        return;
                    }

                    if (!isDrawing.value) return;
                    isDrawing.value = false;
                    const endPos = getCoords(e.changedTouches ? e.changedTouches[0] : e);
                    const drawDist = Math.hypot(endPos.x - startPos.value.x, endPos.y - startPos.value.y);

                    if (drawDist < 12) {
                        currentLine.value = null; currentPath.value = null;
                        const newMarker = { id: Date.now(), x: endPos.x, y: endPos.y, w: 140, h: 56, type: 'general', data: { val: '', name: '', w_in: '', h_in: '', d_in: '', w: '', d: '', h: '', t: '' } };
                        updateMarkerSize(newMarker);
                        activePin.value.markers.push(newMarker);
                        openBottomSheet(newMarker);
                    } else {
                        if (drawMode.value === 'line' && currentLine.value) {
                            activePin.value.lines.push({ ...currentLine.value, id: Date.now() });
                            const midX = Math.round((currentLine.value.x1 + currentLine.value.x2) / 2);
                            const midY = Math.round((currentLine.value.y1 + currentLine.value.y2) / 2);
                            const newMarker = { id: Date.now() + 1, x: midX, y: midY, w: 140, h: 56, type: 'general', data: { val: '', name: '', w_in: '', h_in: '', d_in: '', w: '', d: '', h: '', t: '' } };
                            updateMarkerSize(newMarker);
                            activePin.value.markers.push(newMarker);
                            openBottomSheet(newMarker);
                            currentLine.value = null;
                        } else if (drawMode.value === 'freehand' && currentPath.value) {
                            activePin.value.paths.push({ id: Date.now(), d: currentPath.value });
                            currentPath.value = null;
                        }
                    }
                    saveCurrentProject();
                };

                const compressImage = (file) => {
                    return new Promise((resolve) => {
                        const reader = new FileReader(); reader.readAsDataURL(file);
                        reader.onload = (e) => {
                            const img = new Image(); img.src = e.target.result;
                            img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const MAX = 1200;
                                let w = img.width, h = img.height;
                                if (w > MAX || h > MAX) {
                                    if (w > h) { h = Math.round((h * MAX) / w); w = MAX; }
                                    else { w = Math.round((w * MAX) / h); h = MAX; }
                                }
                                canvas.width = w; canvas.height = h;
                                const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                                resolve({ b64: canvas.toDataURL('image/jpeg', 0.65), w, h });
                            };
                        };
                    });
                };

                const handleImageUpload = async (e, type) => {
                    const file = e.target.files[0]; if (!file) return;
                    const res = await compressImage(file);
                    if (type === 'plan') {
                        planImage.value = res.b64;
                    } else if (type === 'photo' && activePin.value) {
                        activePin.value.photo = res.b64;
                        activePin.value.photoW = res.w;
                        activePin.value.photoH = res.h;
                        if (!activePin.value.lines) activePin.value.lines = [];
                        if (!activePin.value.paths) activePin.value.paths = [];
                        nextTick(() => updateWorkspaceSize());
                    }
                    saveCurrentProject();
                };

                const addPinOnPlan = (e) => {
                    if (!planImage.value) return;
                    const rect = e.currentTarget.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    const newPin = { id: Date.now(), name: `位置 ${pins.value.length + 1}`, x, y, photo: null, photoW: 1200, photoH: 900, markers: [], lines: [], paths: [] };
                    pins.value.push(newPin);
                    saveCurrentProject();
                    openPin(newPin);
                };

                const openPin = async (pin) => {
                    activePin.value = pin;
                    currentView.value = 'photo';
                    deleteConfirm.value = false;
                    nextTick(() => {
                        updateWorkspaceSize();
                        setTimeout(updateWorkspaceSize, 60);
                    });

                    // 雲端子節點按需抓取相片 (節省記憶體)
                    if (!pin.photo && db && project.id) {
                        try {
                            const pinDoc = await db.collection('site_projects').doc(`proj_${project.id}`).collection('pins').doc(`pin_${pin.id}`).get();
                            if (pinDoc.exists) {
                                Object.assign(pin, pinDoc.data());
                                nextTick(() => updateWorkspaceSize());
                            }
                        } catch (err) {
                            console.log("Cloud pin fetch offline:", err);
                        }
                    }
                };

                const handleDeletePin = async () => {
                    if (deleteConfirm.value) {
                        const delId = activePin.value.id;
                        pins.value = pins.value.filter(p => p.id !== delId);
                        currentView.value = 'plan';
                        activePin.value = null;
                        deleteConfirm.value = false;
                        saveCurrentProject();

                        if (db && project.id) {
                            try {
                                await db.collection('site_projects').doc(`proj_${project.id}`).collection('pins').doc(`pin_${delId}`).delete();
                            } catch(e) {}
                        }
                    } else {
                        deleteConfirm.value = true;
                        setTimeout(() => { deleteConfirm.value = false; }, 3000);
                    }
                };

                const undoPath = () => {
                    if (activePin.value.paths && activePin.value.paths.length > 0) {
                        activePin.value.paths.pop();
                        saveCurrentProject();
                    }
                };

                const openBottomSheet = (marker) => { activeMarker.value = marker; showBottomSheet.value = true; };
                const closeBottomSheet = () => { showBottomSheet.value = false; saveCurrentProject(); };
                const deleteMarker = () => {
                    activePin.value.markers = activePin.value.markers.filter(m => m.id !== activeMarker.value.id);
                    showBottomSheet.value = false;
                    saveCurrentProject();
                };

                const applyStamp = (txt) => {
                    if (activeMarker.value) {
                        activeMarker.value.data.val = txt;
                        updateMarkerSize(activeMarker.value);
                        closeBottomSheet();
                    }
                };

                const updateMarkerSize = (marker) => {
                    const lines = getMarkerLines(marker);
                    let maxLen = 0;
                    lines.forEach(l => { if (l.length > maxLen) maxLen = l.length; });
                    marker.w = Math.max(120, maxLen * 30 + 36);
                    marker.h = Math.max(54, lines.length * 36 + 18);
                };

                // 印章純字顏色 (5px 黑色立體外描邊，無底框)
                const getStampColor = (marker) => {
                    if (marker.type === 'stamp') {
                        const val = marker.data.val;
                        if (['需清拆', '牆身斜', '牆體不平整', '局部凸出'].includes(val)) return '#ff453a'; // 亮紅
                        if (['開關', '插座', '地腳線'].includes(val)) return '#ffd60a'; // 鮮黃
                        if (['留通道', '開門方向'].includes(val)) return '#0a84ff'; // 亮藍
                        if (['可保留', '實地台'].includes(val)) return '#30d158'; // 亮綠
                        return '#ffd60a';
                    }
                    return '#ffffff';
                };

                const getMarkerLines = (marker) => {
                    if (['window', 'door', 'beam', 'column'].includes(marker.type)) {
                        const lines = [getTagFields(marker.type)[0] ? getTagName(marker.type) : ''];
                        for (let k in marker.data) if (marker.data[k] && getFieldLabel(marker.type, k) !== k) lines.push(`${getFieldLabel(marker.type, k)}:${marker.data[k]}`);
                        return lines;
                    }
                    if (marker.type === 'stamp') return [marker.data.val || '未定'];
                    const label = marker.data.name ? `${marker.data.name}: ` : '';
                    return [`${label}${marker.data.val || '?'}mm`];
                };

                const getTagName = (t) => ({ 'window': '窗', 'door': '門洞', 'beam': '樑', 'column': '柱' })[t] || '';
                const getTagFields = (t) => ({
                    'door': [{ key: 'w_in', label: '闊' }, { key: 'h_in', label: '高' }, { key: 't', label: '牆厚' }],
                    'window': [{ key: 'w_in', label: '內闊' }, { key: 'h_in', label: '內高' }, { key: 'd_in', label: '內深' }],
                    'beam': [{ key: 'w', label: '樑闊' }, { key: 'd', label: '樑深' }, { key: 'h', label: '底高' }],
                    'column': [{ key: 'w', label: '柱闊' }, { key: 'd', label: '柱深' }, { key: 'h', label: '柱高' }]
                })[t] || [];
                const getFieldLabel = (t, k) => { const f = getTagFields(t).find(i => i.key === k); return f ? f.label : k; };

                // 雙軌儲存核心 (方案 A：子集合拆分徹底避開 1MB 容量限制)
                const saveCurrentProject = async () => {
                    if (!project.id) return;
                    
                    // 1. 本地 LocalForage 即時儲存 (零延遲)
                    const localData = { 
                        id: project.id, 
                        name: project.name, 
                        date: project.date, 
                        planImage: planImage.value, 
                        pins: JSON.parse(JSON.stringify(pins.value)) 
                    };
                    await localforage.setItem('proj_' + project.id, localData);

                    // 2. 背景同步至 Firebase Firestore
                    if (db) {
                        cloudSyncState.value = 'syncing';
                        try {
                            const projRef = db.collection('site_projects').doc(`proj_${project.id}`);
                            
                            // 主文件：只存工程概要與釘位清單 (<100KB)
                            await projRef.set({
                                id: project.id,
                                name: project.name || '',
                                date: project.date || '',
                                planImage: planImage.value || null,
                                pinList: pins.value.map(p => ({ id: p.id, name: p.name, x: p.x, y: p.y })),
                                updatedAt: Date.now()
                            }, { merge: true });

                            // 子集合：單張相片獨立文件儲存 (~150KB)，杜絕溢出
                            if (activePin.value && activePin.value.photo) {
                                await projRef.collection('pins').doc(`pin_${activePin.value.id}`).set({
                                    id: activePin.value.id,
                                    name: activePin.value.name,
                                    x: activePin.value.x,
                                    y: activePin.value.y,
                                    photo: activePin.value.photo,
                                    photoW: activePin.value.photoW || 1200,
                                    photoH: activePin.value.photoH || 900,
                                    markers: activePin.value.markers || [],
                                    lines: activePin.value.lines || [],
                                    paths: activePin.value.paths || [],
                                    updatedAt: Date.now()
                                }, { merge: true });
                            }
                            cloudSyncState.value = 'ready';
                        } catch (err) {
                            console.error("Firestore sync error:", err);
                            cloudSyncState.value = 'error';
                        }
                    }
                };

                const syncCloudProjects = async () => {
                    if (!db) return;
                    cloudSyncState.value = 'syncing';
                    try {
                        const snap = await db.collection('site_projects').orderBy('updatedAt', 'desc').get();
                        const cloudList = [];
                        snap.forEach(doc => {
                            const d = doc.data();
                            cloudList.push({
                                id: d.id,
                                name: d.name,
                                date: d.date,
                                pinCount: d.pinList ? d.pinList.length : 0
                            });
                        });
                        if (cloudList.length > 0) {
                            projectList.value = cloudList;
                        }
                        cloudSyncState.value = 'ready';
                    } catch (err) {
                        cloudSyncState.value = 'error';
                    }
                };

                const loadProjectList = async () => {
                    const keys = await localforage.keys();
                    const list = [];
                    for (let k of keys) {
                        if (k.startsWith('proj_')) {
                            const d = await localforage.getItem(k);
                            if (d) list.push({ id: d.id, name: d.name, date: d.date, pinCount: d.pins ? d.pins.length : 0 });
                        }
                    }
                    projectList.value = list.sort((a, b) => b.id - a.id);
                    syncCloudProjects();
                };

                const createNewProject = () => {
                    const id = Date.now();
                    project.id = id;
                    project.name = '';
                    project.date = new Date().toISOString().split('T')[0];
                    planImage.value = null;
                    pins.value = [];
                    currentView.value = 'plan';
                    saveCurrentProject();
                };

                const loadProject = async (id) => {
                    // 本地快取優先載入
                    const d = await localforage.getItem('proj_' + id);
                    if (d) {
                        project.id = d.id;
                        project.name = d.name;
                        project.date = d.date;
                        planImage.value = d.planImage;
                        pins.value = d.pins || [];
                        currentView.value = 'plan';
                    }

                    // 從 Firestore 補全子集合相片與最新資料
                    if (db) {
                        try {
                            const projDoc = await db.collection('site_projects').doc(`proj_${id}`).get();
                            if (projDoc.exists) {
                                const pd = projDoc.data();
                                project.name = pd.name;
                                project.date = pd.date;
                                if (!planImage.value && pd.planImage) planImage.value = pd.planImage;

                                const pinsSnap = await db.collection('site_projects').doc(`proj_${id}`).collection('pins').get();
                                const fullPins = [];
                                pinsSnap.forEach(pDoc => fullPins.push(pDoc.data()));
                                if (fullPins.length > 0) {
                                    pins.value = fullPins.sort((a, b) => a.id - b.id);
                                    saveCurrentProject();
                                }
                            }
                        } catch (e) {
                            console.log("Cloud load offline:", e);
                        }
                    }
                };

                const deleteProject = async (id) => {
                    if (confirm("確定刪除此工程？")) {
                        await localforage.removeItem('proj_' + id);
                        if (db) {
                            try {
                                await db.collection('site_projects').doc(`proj_${id}`).delete();
                            } catch (e) {}
                        }
                        loadProjectList();
                    }
                };

                const backToProjects = () => {
                    saveCurrentProject();
                    loadProjectList();
                    currentView.value = 'projects';
                };

                onMounted(() => {
                    loadProjectList();
                    window.addEventListener('resize', updateWorkspaceSize);
                    window.addEventListener('orientationchange', () => setTimeout(updateWorkspaceSize, 150));
                });

                // 單張相片高清合成轉印 (純字黑描邊，零底框)
                const renderPinCanvas = (pin) => {
                    return new Promise((resolve) => {
                        const img = new Image();
                        img.src = pin.photo;
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const w = pin.photoW || 1200;
                            const h = pin.photoH || 900;
                            canvas.width = w; canvas.height = h;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, w, h);

                            ctx.fillStyle = 'rgba(0,0,0,0.85)';
                            ctx.fillRect(0, 0, w, 70);
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 30px sans-serif';
                            ctx.textBaseline = 'middle';
                            ctx.textAlign = 'left';
                            ctx.fillText(`📍 ${project.name || '未命名'} | ${pin.name} | ${project.date}`, 20, 35);

                            ctx.strokeStyle = '#ff0044'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                            if (pin.lines) {
                                pin.lines.forEach(l => {
                                    ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
                                });
                            }
                            if (pin.paths) {
                                pin.paths.forEach(p => {
                                    const path = new Path2D(p.d);
                                    ctx.stroke(path);
                                });
                            }

                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            if (pin.markers) {
                                pin.markers.forEach(m => {
                                    const lines = getMarkerLines(m);
                                    const color = getStampColor(m);
                                    ctx.font = '900 28px sans-serif';
                                    lines.forEach((line, i) => {
                                        const textY = m.y - (lines.length > 1 ? 16 : 0) + (i * 34);
                                        ctx.lineWidth = 7; 
                                        ctx.strokeStyle = '#000000'; 
                                        ctx.lineJoin = 'round';
                                        ctx.strokeText(line, m.x, textY);
                                        ctx.fillStyle = color; 
                                        ctx.fillText(line, m.x, textY);
                                    });
                                });
                            }
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        };
                    });
                };

                const exportSingleImage = async () => {
                    if (!activePin.value || !activePin.value.photo) return;
                    isProcessing.value = true; processingText.value = '正在產出單張相片...';
                    const dataUrl = await renderPinCanvas(activePin.value);
                    const link = document.createElement('a');
                    link.download = `${project.name || '工程'}_${activePin.value.name}.jpg`;
                    link.href = dataUrl; link.click();
                    isProcessing.value = false;
                };

                // A4 四格 PDF 報告生成器 (第 1 頁全圖，第 2 頁起 2x2 四格矩陣)
                const exportPdfReport = async () => {
                    isProcessing.value = true;
                    processingText.value = '正在排版 A4 四格 PDF 報告...';
                    setTimeout(async () => {
                        try {
                            const { jsPDF } = window.jspdf;
                            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                            const PAGE_W = 1240;
                            const PAGE_H = 1754;

                            // --- 第 1 頁：全案平面總圖 ---
                            const page1Canvas = document.createElement('canvas');
                            page1Canvas.width = PAGE_W; page1Canvas.height = PAGE_H;
                            const ctx1 = page1Canvas.getContext('2d');
                            ctx1.fillStyle = '#ffffff'; ctx1.fillRect(0, 0, PAGE_W, PAGE_H);

                            ctx1.fillStyle = '#111827'; ctx1.fillRect(0, 0, PAGE_W, 140);
                            ctx1.fillStyle = '#ffffff'; ctx1.font = 'bold 44px sans-serif'; ctx1.textAlign = 'left';
                            ctx1.fillText(`工程度尺總表: ${project.name || '未命名'}`, 50, 70);
                            ctx1.font = 'bold 26px sans-serif'; ctx1.fillStyle = '#9ca3af';
                            ctx1.fillText(`度尺日期: ${project.date}   |   標註位置總數: ${pins.value.length} 個`, 50, 115);

                            if (planImage.value) {
                                const pImg = new Image();
                                pImg.src = planImage.value;
                                await new Promise(r => pImg.onload = r);
                                const planDrawW = PAGE_W - 100;
                                const planDrawH = Math.min(1300, (pImg.height / pImg.width) * planDrawW);
                                const planDrawX = 50; const planDrawY = 180;
                                ctx1.drawImage(pImg, planDrawX, planDrawY, planDrawW, planDrawH);

                                pins.value.forEach((pin, idx) => {
                                    const px = planDrawX + (pin.x / 100) * planDrawW;
                                    const py = planDrawY + (pin.y / 100) * planDrawH;
                                    ctx1.beginPath(); ctx1.arc(px, py - 25, 22, 0, 2 * Math.PI);
                                    ctx1.fillStyle = '#dc2626'; ctx1.fill();
                                    ctx1.fillStyle = '#ffffff'; ctx1.font = 'bold 24px sans-serif';
                                    ctx1.textAlign = 'center'; ctx1.textBaseline = 'middle';
                                    ctx1.fillText(idx + 1, px, py - 25);
                                });
                            }
                            doc.addImage(page1Canvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);

                            // --- 第 2 頁及之後：每頁 4 格相片 (2 x 2 矩陣) ---
                            const photoPins = pins.value.filter(p => p.photo);
                            const totalPages = Math.ceil(photoPins.length / 4);

                            const marginX = 50;
                            const marginY = 130;
                            const gap = 30;
                            const cellW = (PAGE_W - (marginX * 2) - gap) / 2;
                            const cellH = (PAGE_H - marginY - 60 - gap) / 2;

                            const cellSlots = [
                                { x: marginX, y: marginY },
                                { x: marginX + cellW + gap, y: marginY },
                                { x: marginX, y: marginY + cellH + gap },
                                { x: marginX + cellW + gap, y: marginY + cellH + gap }
                            ];

                            for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
                                doc.addPage();
                                const pageNCanvas = document.createElement('canvas');
                                pageNCanvas.width = PAGE_W; pageNCanvas.height = PAGE_H;
                                const ctxN = pageNCanvas.getContext('2d');
                                ctxN.fillStyle = '#f3f4f6'; ctxN.fillRect(0, 0, PAGE_W, PAGE_H);

                                ctxN.fillStyle = '#1f2937'; ctxN.fillRect(0, 0, PAGE_W, 90);
                                ctxN.fillStyle = '#ffffff'; ctxN.font = 'bold 36px sans-serif'; ctxN.textAlign = 'left';
                                ctxN.fillText(`${project.name || '工程'} - 現場詳細記錄 (第 ${pageIdx + 1} / ${totalPages} 頁)`, 50, 58);

                                for (let slot = 0; slot < 4; slot++) {
                                    const pinIndex = (pageIdx * 4) + slot;
                                    if (pinIndex >= photoPins.length) break;

                                    const pin = photoPins[pinIndex];
                                    const slotPos = cellSlots[slot];

                                    ctxN.fillStyle = '#ffffff';
                                    ctxN.fillRect(slotPos.x, slotPos.y, cellW, cellH);
                                    ctxN.strokeStyle = '#d1d5db'; ctxN.lineWidth = 2;
                                    ctxN.strokeRect(slotPos.x, slotPos.y, cellW, cellH);

                                    ctxN.fillStyle = '#111827'; ctxN.fillRect(slotPos.x, slotPos.y, cellW, 55);
                                    ctxN.fillStyle = '#ffffff'; ctxN.font = 'bold 26px sans-serif'; ctxN.textAlign = 'left';
                                    ctxN.fillText(`📍 [位置 ${pinIndex + 1}] ${pin.name}`, slotPos.x + 16, slotPos.y + 36);

                                    const renderedData = await renderPinCanvas(pin);
                                    const phImg = new Image(); phImg.src = renderedData;
                                    await new Promise(r => phImg.onload = r);

                                    const maxPhotoW = cellW - 20;
                                    const maxPhotoH = cellH - 75;
                                    let dw = maxPhotoW;
                                    let dh = (phImg.height / phImg.width) * dw;
                                    if (dh > maxPhotoH) {
                                        dh = maxPhotoH;
                                        dw = (phImg.width / phImg.height) * dh;
                                    }
                                    const dx = slotPos.x + (cellW - dw) / 2;
                                    const dy = slotPos.y + 65 + ((maxPhotoH - dh) / 2);

                                    ctxN.drawImage(phImg, dx, dy, dw, dh);
                                }

                                doc.addImage(pageNCanvas.toDataURL('image/jpeg', 0.85), 'JPEG', 0, 0, 210, 297);
                            }

                            doc.save(`${project.name || '工程'}_度尺報告.pdf`);
                        } catch (err) {
                            alert("生成 PDF 失敗，請重試。");
                        }
                        isProcessing.value = false;
                    }, 50);
                };

                return {
                    currentView, projectList, project, planImage, pins, activePin, drawMode,
                    showBottomSheet, activeMarker, deleteConfirm, isProcessing, processingText,
                    cloudStatusText, cloudStatusClass, syncCloudProjects,
                    workspace, svgCanvas, wrapperStyle, currentLine, currentPath,
                    handleImageUpload, addPinOnPlan, openPin, handleDeletePin, undoPath,
                    handleTouchStart, handleTouchMove, handleTouchEnd, startDrag,
                    openBottomSheet, closeBottomSheet, deleteMarker, applyStamp, updateMarkerSize, getStampColor, getMarkerLines,
                    createNewProject, loadProject, deleteProject, backToProjects, saveCurrentProject,
                    getTagFields, exportSingleImage, exportPdfReport
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
