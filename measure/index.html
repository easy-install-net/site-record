<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="度尺寶 Pro">
    <title>度尺寶 Pro v9.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh;
            margin: 0; padding: 0; overflow: hidden; background: #ffffff; color: #111827;
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
            overscroll-behavior: none; touch-action: manipulation;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
        }
        input, select, textarea { font-size: 16px !important; -webkit-user-select: text; user-select: text; color: #111827; }
        .canvas-touch-lock { touch-action: none !important; }
        .touch-scrollable { touch-action: pan-y !important; -webkit-overflow-scrolling: touch; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .micro-btn {
            padding: 5px 8px; font-size: 14px; font-weight: 700; line-height: 1.2; letter-spacing: 0.5px;
            border: 1px solid #d1d5db; border-radius: 6px; white-space: nowrap;
            background: #ffffff; color: #111827;
        }
        .micro-btn:active { background: #e5e7eb; }
        .stamp-text {
            font-weight: 900; paint-order: stroke fill; letter-spacing: 1px;
            stroke: #000; stroke-width: 5px; stroke-linejoin: round; stroke-linecap: round;
            pointer-events: none;
        }
        .wm-text {
            font-weight: 900; font-size: 23px; paint-order: stroke fill; letter-spacing: 1px;
            stroke: #000; stroke-width: 6px; stroke-linejoin: round; stroke-linecap: round;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased">
    <div id="boot-screen" style="position:fixed;inset:0;z-index:200;background:#ffffff;color:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;">
        <div id="boot-msg" style="font-size:16px;font-weight:700;">⏳ 正在啟動度尺寶 Pro v9.5...</div>
        <button id="boot-retry" onclick="location.reload()" style="display:none;margin-top:16px;background:#111827;color:#fff;border:none;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:700;cursor:pointer;">🔄 重新載入</button>
    </div>
    
    <div id="app" class="fixed inset-0 w-full h-full flex flex-col overflow-hidden bg-zinc-50" style="display:none;">
        
        <!-- 頂部導航欄 -->
        <div class="shrink-0 w-full flex flex-col z-30 bg-white border-b border-zinc-200">
            <header class="h-11 w-full px-2 flex justify-between items-center gap-1 overflow-hidden">
                <div class="flex items-center gap-1 min-w-0 flex-1">
                    <span v-if="currentView === 'dir'" class="text-sm font-bold text-zinc-900 truncate">工程目錄</span>
                    <template v-else>
                        <button @click="backToProjects" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold shrink-0">‹目錄</button>
                        <button @click="downloadNow" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold shrink-0">⬇️載入</button>
                    </template>
                    <span @click="showCloudDetail" :class="cloudStatusClass" class="text-[10px] px-1.5 py-0.5 rounded-md font-bold shrink-0 cursor-pointer border">{{ cloudStatusText }}</span>
                    <template v-if="currentView !== 'dir'">
                        <button @click="copyCode(project.code)" class="bg-amber-100 text-amber-900 border border-amber-300 text-xs font-mono font-black px-1.5 py-0.5 rounded-md shrink-0 ml-0.5">#{{ project.code }}</button>
                        <input v-model="project.name" @input="markProjectChanged" @blur="saveAll" @keyup.enter="$event.target.blur()" placeholder="點擊輸入地址..." class="ml-1 bg-zinc-50 focus:bg-white border border-zinc-300 focus:border-blue-500 text-zinc-900 text-[15px] font-bold min-w-0 flex-1 px-2 py-0.5 rounded-md focus:outline-none truncate">
                    </template>
                </div>
                
                <div class="flex gap-1 items-center shrink-0">
                    <template v-if="currentView === 'dir'">
                        <button @click="openCloudBrowser" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold">☁️雲端庫</button>
                        <button @click="showJoinModal = true" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold">🔑組合</button>
                        <button @click="createNewProject" class="bg-zinc-900 text-white px-3 py-1 rounded-md text-xs font-bold">+新建</button>
                    </template>
                    <template v-else-if="currentView === 'preview'">
                        <button @click="enterEditMode(0)" class="bg-zinc-900 text-white px-3 py-1 rounded-md text-xs font-bold">✏️編輯</button>
                        <button @click="copyShareLink" class="bg-indigo-50 border border-indigo-300 text-indigo-700 px-2.5 py-1 rounded-md text-xs font-bold active:bg-indigo-100">🔗發給師傅</button>
                        <button v-if="pages.length" @click="showPdfModal = true" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold">PDF</button>
                    </template>
                    <template v-else>
                        <button @click="switchToPreview" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold">👁️預覽</button>
                        <button @click="uploadNow" :class="hasUnsavedCloudChanges ? 'bg-blue-600 text-white border-blue-600' : 'bg-white border-zinc-300 text-zinc-800'" class="px-2.5 py-1 rounded-md text-xs font-bold border transition-colors">⬆️上傳</button>
                        <button v-if="pages.length" @click="showPdfModal = true" class="bg-white border border-zinc-300 text-zinc-800 px-2.5 py-1 rounded-md text-xs font-bold">PDF</button>
                    </template>
                </div>
            </header>

            <!-- 編輯工具列 -->
            <div v-if="currentView === 'proj'" class="w-full flex flex-col bg-white border-b border-zinc-200 shrink-0">
                <div class="h-11 px-1 flex items-center justify-center gap-1 overflow-x-auto no-scrollbar">
                    <div class="flex items-center gap-1 shrink-0">
                        <button v-for="m in [{id:'browse',l:'👆 睇圖'},{id:'smart',l:'✨ 智能'},{id:'arrow-single',l:'單箭'},{id:'freehand',l:'繪圖'},{id:'wall',l:'牆線'}]"
                                :key="m.id" @click="drawMode = m.id"
                                :class="drawMode === m.id ? 'bg-zinc-900 text-white border-zinc-900' : 'bg-white text-zinc-700 border-zinc-300'"
                                class="px-2 py-1 text-[13px] font-bold rounded-md border">{{ m.l }}</button>
                        <button v-if="!activePin" @click="drawMode = 'pin'" :class="drawMode === 'pin' ? 'bg-red-50 text-red-700 border-red-300' : 'bg-white text-zinc-700 border-zinc-300'" class="px-2 py-1 text-[13px] font-bold rounded-md border">落釘</button>
                        <button @click="drawMode = 'eraser'" :class="drawMode === 'eraser' ? 'bg-red-600 text-white border-red-600' : 'bg-white text-red-600 border-red-200'" class="px-2 py-1 text-[13px] font-bold rounded-md border">🧽擦膠</button>
                    </div>
                    <div class="flex items-center gap-1 border-l border-zinc-300 pl-1 shrink-0">
                        <button @click="undoLastAction" :class="hasUndoItems ? 'text-zinc-900 border-zinc-400 bg-zinc-50' : 'text-zinc-300 border-zinc-200 bg-white'" class="px-2 py-1 text-sm font-bold rounded-md border">↶</button>
                        <button @click="redoAction" :class="hasRedoItems ? 'text-zinc-900 border-zinc-400 bg-zinc-50' : 'text-zinc-300 border-zinc-200 bg-white'" class="px-2 py-1 text-sm font-bold rounded-md border">↷</button>
                    </div>
                </div>

                <div class="h-8 bg-zinc-50 border-t border-zinc-200 flex items-center justify-center gap-2 px-2" :class="['arrow-single','freehand','wall'].includes(drawMode) ? 'opacity-100' : 'opacity-0 pointer-events-none'">
                    <template v-if="drawMode === 'wall'">
                        <div class="flex items-center gap-1 bg-white border border-zinc-300 rounded p-0.5">
                            <button @click="wallStyle = 'hollow'" :class="wallStyle === 'hollow' ? 'bg-zinc-900 text-white' : 'text-zinc-600'" class="px-2 py-0.5 rounded text-[11px] font-bold">═空心雙線</button>
                            <button @click="wallStyle = 'hatched'" :class="wallStyle === 'hatched' ? 'bg-zinc-900 text-white' : 'text-zinc-600'" class="px-2 py-0.5 rounded text-[11px] font-bold">⫽斜線陰影</button>
                        </div>
                        <button v-for="c in ['#111827','#ef4444','#3b82f6','#ffffff']" :key="c" @click="wallColor = c" :style="{backgroundColor: c}" :class="wallColor === c ? 'ring-2 ring-zinc-900 scale-110' : ''" class="w-4 h-4 rounded-full border border-zinc-400"></button>
                    </template>
                    <template v-else-if="drawMode === 'arrow-single'">
                        <span class="text-[11px] text-zinc-600 font-bold">顏色:</span>
                        <button v-for="c in [{id:'gray',bg:'bg-gray-400'},{id:'white',bg:'bg-white'},{id:'red',bg:'bg-red-500'}]" :key="c.id" @click="arrowColor = c.id" :class="[c.bg, arrowColor === c.id ? 'ring-2 ring-zinc-900 scale-110' : '']" class="w-4 h-4 rounded-full border border-zinc-300"></button>
                    </template>
                    <template v-else>
                        <span class="text-[11px] text-zinc-600 font-bold">顏色:</span>
                        <button v-for="c in ['#3b82f6','#eab308','#ef4444','#111827']" :key="c" @click="freehandColor = c" :style="{backgroundColor: c}" :class="freehandColor === c ? 'ring-2 ring-zinc-900 scale-110' : ''" class="w-4 h-4 rounded-full border border-zinc-400"></button>
                    </template>
                </div>
            </div>
        </div>

        <div v-if="toastMsg" class="fixed top-12 left-1/2 -translate-x-1/2 z-[80] bg-zinc-900 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl border border-zinc-700 whitespace-nowrap">{{ toastMsg }}</div>

        <!-- 1. 工程目錄視圖 -->
        <main v-show="currentView === 'dir'" class="flex-1 min-h-0 w-full p-3 overflow-y-auto touch-scrollable">
            <div v-if="!projectList.length" class="text-center text-zinc-500 mt-20 text-sm font-bold">本機暫無工程。<br>點右上「+新建」或「☁️雲端庫」連通。</div>
            <div v-for="proj in projectList" :key="proj.code" class="bg-white border border-zinc-300 p-3 rounded-lg mb-2.5 flex justify-between items-center shadow-sm">
                <div class="flex-1 mr-2 cursor-pointer min-w-0" @click="loadProject(proj.code, true)">
                    <div class="flex items-center gap-1.5">
                        <span class="bg-amber-100 text-amber-900 border border-amber-300 text-xs font-black px-1.5 py-0.5 rounded-md shrink-0">#{{ proj.code }}</span>
                        <div class="font-bold text-sm text-zinc-900 truncate">{{ proj.name || '未輸入地址' }}</div>
                        <span v-if="proj.pendingUpload" class="bg-blue-50 text-blue-700 border border-blue-300 text-[10px] font-bold px-1.5 py-0.5 rounded-md shrink-0">⏳待上傳</span>
                    </div>
                    <div class="text-[11px] text-zinc-500 mt-1 flex flex-col gap-0.5">
                        <span>{{ proj.date }} ｜ {{ proj.page
