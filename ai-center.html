<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智慧記帳與物料管理</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 8px; color: #333; } /* 縮小外部 padding */
    .card { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 500px; margin: 0 auto; } /* 縮小卡片 padding */
    h2 { margin-top: 0; margin-bottom: 10px; font-size: 1.15rem; text-align: center; color: #1a1a1a; }
    
    label { font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 4px; display: block; } /* 縮小標籤與輸入框的距離 */
    .form-group { margin-bottom: 10px; } /* 縮小各區塊間距 */
    
    input, select, textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #dcdfe6; font-size: 0.95rem; outline: none; background: #fff; } /* 縮小輸入框 padding */
    input:focus, select:focus, textarea:focus { border-color: #007aff; }
    
    /* 3格日期樣式 */
    .date-row { display: flex; gap: 6px; }
    .date-row input { text-align: center; font-weight: bold; }
    
    /* 按鈕晶片樣式 */
    .btn-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; } /* 縮小按鈕間距 */
    .chip { padding: 5px 10px; border-radius: 14px; font-size: 0.8rem; background: #f0f2f5; border: 1px solid #e1e4e8; cursor: pointer; user-select: none; transition: 0.2s; } /* 縮小按鈕 padding */
    .chip.active { background: #007aff; color: #fff; border-color: #007aff; font-weight: 600; }
    .chip.biz { border-color: #ffd591; background: #fff7e6; color: #d46b08; }
    .chip.biz.active { background: #fa8c16; color: #fff; border-color: #fa8c16; font-weight: 600; }
    
    .preview-box { width: 100%; max-height: 120px; object-fit: contain; border-radius: 6px; margin-top: 6px; display: none; background: #eee; }
    .submit-btn { width: 100%; padding: 12px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 6px; }
    .submit-btn:disabled { background: #b0c4de; cursor: not-allowed; }
    .status-msg { margin-top: 8px; text-align: center; font-size: 0.85rem; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>📝 快速記帳與物料登記</h2>

  <!-- 消費日期 (3 格數字) -->
  <div class="form-group">
    <label>📅 消費日期 (年/月/日)</label>
    <div class="date-row">
      <input type="number" id="year" placeholder="年" style="flex: 1.2;">
      <input type="number" id="month" placeholder="月" style="flex: 1;">
      <input type="number" id="day" placeholder="日" style="flex: 1;">
    </div>
  </div>

  <!-- 分類快捷鍵 -->
  <div class="form-group">
    <label>🏷️ 選擇分類</label>
    <div style="font-size:0.75rem; color:#888; margin-bottom:2px;">工作與工程採購：</div>
    <div class="btn-group">
      <div class="chip biz active" onclick="selectCategory(this, '供應商訂購物料')">📦 供應商訂購物料</div>
      <div class="chip biz" onclick="selectCategory(this, '工地/現場雜支')">🔧 工地/現場雜支</div>
      <div class="chip biz" onclick="selectCategory(this, '業務/交際')">💼 業務/交際</div>
    </div>
    <div style="font-size:0.75rem; color:#888; margin:4px 0 2px 0;">生活日常消費：</div>
    <div class="btn-group">
      <div class="chip" onclick="selectCategory(this, '餐飲')">🍽️ 餐飲</div>
      <div class="chip" onclick="selectCategory(this, '交通/油費')">🚗 交通/油費</div>
      <div class="chip" onclick="selectCategory(this, '超市/日常')">🛒 超市/日常</div>
      <div class="chip" onclick="selectCategory(this, '飲品/小食')">☕ 飲品/小食</div>
      <div class="chip" onclick="selectCategory(this, '其他雜費')">💡 其他雜費</div>
      <div class="chip" onclick="selectCategory(this, '其他')">➕ 其他</div>
    </div>
    <input type="hidden" id="selectedCategory" value="供應商訂購物料">
  </div>

  <!-- 金額 -->
  <div class="form-group">
    <label>💰 金額 (留空則由 AI 辨識)</label>
    <input type="number" step="any" id="amount" placeholder="例如: 380">
  </div>

  <!-- 消費地點 / 店家 / 供應商 -->
  <div class="form-group">
    <label>🏢 店家 / 供應商 (留空由 AI 辨識)</label>
    <input type="text" id="merchant" placeholder="例如: 大角咀五金 / 大家樂">
  </div>

  <!-- 付款方式快捷鍵 -->
  <div class="form-group">
    <label>💳 付款方式</label>
    <div class="btn-group">
      <div class="chip active" onclick="selectPayment(this, '公司帳戶')">公司帳戶</div>
      <div class="chip" onclick="selectPayment(this, '現金')">現金</div>
      <div class="chip" onclick="selectPayment(this, '八達通')">八達通</div>
      <div class="chip" onclick="selectPayment(this, '信用卡')">信用卡</div>
      <div class="chip" onclick="selectPayment(this, 'PayMe/FPS')">PayMe/FPS</div>
    </div>
    <input type="hidden" id="paymentMethod" value="公司帳戶">
  </div>

  <!-- 消費用途 / 物料備註 -->
  <div class="form-group">
    <label>📝 用途目的 / 物料細節</label>
    <textarea id="notes" rows="2" placeholder="例如: 批盪灰 2 包、螺絲釘"></textarea>
  </div>

  <!-- 拍照收據 (選填) -->
  <div class="form-group">
    <label>📷 單據拍照 / 上傳 (選填)</label>
    <input type="file" id="receiptImg" accept="image/*" capture="environment">
    <img id="preview" class="preview-box">
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitData()">💾 儲存並寫入試算表</button>
  <div class="status-msg" id="statusMsg"></div>
</div>

<script>
  const today = new Date();
  document.getElementById('year').value = today.getFullYear();
  document.getElementById('month').value = String(today.getMonth() + 1).padStart(2, '0');
  document.getElementById('day').value = String(today.getDate()).padStart(2, '0');

  function selectCategory(el, val) {
    document.querySelectorAll('.chip').forEach(c => {
      if (c.onclick && c.onclick.toString().includes('selectCategory')) c.classList.remove('active');
    });
    el.classList.add('active');
    document.getElementById('selectedCategory').value = val;
  }

  function selectPayment(el, val) {
    document.querySelectorAll('.chip').forEach(c => {
      if (c.onclick && c.onclick.toString().includes('selectPayment')) c.classList.remove('active');
    });
    el.classList.add('active');
    document.getElementById('paymentMethod').value = val;
  }

  let base64String = "";
  document.getElementById('receiptImg').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        base64String = event.target.result.split(',')[1];
        const preview = document.getElementById('preview');
        preview.src = event.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  // ⚠️ 請換回你 Google Apps Script 的真實 Web App 網址
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz_vQ4fMhYnptqZ25fBfU9bWnCqC9_YOUR_GAS_ID/exec";

  async function submitData() {
    const y = document.getElementById('year').value.trim();
    const m = String(document.getElementById('month').value.trim()).padStart(2, '0');
    const d = String(document.getElementById('day').value.trim()).padStart(2, '0');
    const fullDate = `${y}-${m}-${d}`;
    const yy = y.slice(-2);
    const shortDate = `${yy}${m}${d}`; 

    const category = document.getElementById('selectedCategory').value;
    const amount = document.getElementById('amount').value.trim();
    const merchant = document.getElementById('merchant').value.trim();
    const payment = document.getElementById('paymentMethod').value;
    const notes = document.getElementById('notes').value.trim();

    const imgFilename = `${shortDate}-${amount || "待定"}-${merchant || "未命名"}.jpg`;

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.innerText = "⏳ 儲存與分析中...";
    msg.style.color = "#007aff";
    msg.innerText = "正在同步至試算表...";

    const payload = {
      date: fullDate,
      category: category,
      amount: amount,
      merchant: merchant,
      payment: payment,
      notes: notes,
      imageBase64: base64String,
      filename: imgFilename
    };

    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === "success") {
        msg.style.color = "#52c41a";
        msg.innerText = `✅ 成功！(${data.item || merchant} - $${data.amount || amount})`;
        document.getElementById('amount').value = "";
        document.getElementById('merchant').value = "";
        document.getElementById('notes').value = "";
        document.getElementById('receiptImg').value = "";
        document.getElementById('preview').style.display = "none";
        base64String = "";
      } else {
        msg.style.color = "#ff4d4f";
        msg.innerText = "❌ 發生錯誤: " + data.message;
      }
    } catch (err) {
      msg.style.color = "#ff4d4f";
      msg.innerText = "❌ 發送失敗，請確認網路。";
    } finally {
      btn.disabled = false;
      btn.innerText = "💾 儲存並寫入試算表";
    }
  }
</script>
</body>
</html>
