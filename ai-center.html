<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>業務控制中心</title>
  <!-- 引入 Tesseract.js 本機免金鑰 OCR 辨識庫 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* 1. 最底層背景：沉穩灰色 */
    body { background-color: #8c8c8c; color: #000; padding: 8px 8px 80px 8px; font-size: 15px; }

    /* 頂部標題 */
    .header { border: 2px solid #000; padding: 10px; text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 8px; background: #e0e0e0; }

    /* 2. 卡片區塊：淺灰底 */
    .box { border: 1px solid #333; padding: 10px; margin-bottom: 8px; background: #e0e0e0; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .box-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; border-bottom: 1.5px solid #000; padding-bottom: 4px; }

    /* 3. 輸入區域：純白底 + 幼黑框 */
    label { display: block; font-size: 13px; font-weight: bold; margin: 6px 0 2px 0; color: #111; }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      font-size: 15px;
      border: 1px solid #000;
      border-radius: 2px;
      outline: none;
      background: #ffffff;
      color: #000;
      margin-bottom: 4px;
      -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus { border: 1px solid #000; box-shadow: 0 0 0 1px #000; }
    textarea { resize: vertical; min-height: 80px; }

    /* 佈局：左右雙欄 (Row / Col) */
    .row { display: flex; gap: 8px; }
    .col { flex: 1; }

    /* 4. 操作按鈕：中黑框 */
    .btn {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      cursor: pointer;
      margin-top: 6px;
      display: block;
      text-align: center;
      border-radius: 2px;
    }
    .btn:active { background: #333; }
    .btn-outline { background: #e0e0e0; color: #000; border: 2px solid #000; }
    .btn-outline:active { background: #ccc; }
    .btn-group { display: flex; gap: 8px; margin-top: 6px; }
    .btn-group .btn { margin-top: 0; }

    /* 多選標籤 */
    .tag-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .tag {
      border: 1px solid #000;
      background: #fff;
      color: #000;
      padding: 4px 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      border-radius: 2px;
    }
    .tag.selected { background: #000; color: #fff; border: 1px solid #000; }

    /* 相機上傳框 */
    .upload-zone {
      border: 1px dashed #000;
      padding: 12px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      margin-bottom: 8px;
      font-weight: bold;
      border-radius: 2px;
    }

    /* 結果回覆區 */
    .reply-area {
      border: 1px dashed #000;
      padding: 8px;
      margin-top: 8px;
      font-size: 14px;
      min-height: 42px;
      white-space: pre-wrap;
      word-break: break-all;
      background: #ffffff;
      border-radius: 2px;
    }

    /* 記憶連動 Checkbox */
    .checkbox-container { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: bold; margin-bottom: 6px; }
    .checkbox-container input { width: auto; margin-bottom: 0; }

    /* 底部導航列 (6格) */
    .navbar {
      position: fixed; bottom: 0; left: 0; width: 100%; height: 55px; background: #e0e0e0; border-top: 2px solid #000; display: flex; z-index: 999;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: #444; border-right: 1px solid #bbb; cursor: pointer;
    }
    .nav-btn:last-child { border-right: none; }
    .nav-btn.active { color: #000; background: #fff; border-top: 3px solid #000; }
    .nav-btn .icon { font-size: 16px; margin-bottom: 2px; }

    .page-tab { display: none; }
    .page-tab.active { display: block; }
  </style>
</head>
<body>

  <div class="header" id="topTitle">🤖 AI 助理</div>

  <!-- P1：AI 助理 -->
  <div id="page-ai" class="page-tab active">
    <div class="box">
      <div class="box-title">⚡ 提問引導（可多選組合）</div>
      <div class="tag-container">
        <span class="tag" onclick="toggleTag(this, '推廣點子')">💡 推廣點子</span>
        <span class="tag" onclick="toggleTag(this, '異業合作')">🤝 異業合作</span>
        <span class="tag" onclick="toggleTag(this, '客訴應對')">💢 客訴應對</span>
        <span class="tag" onclick="toggleTag(this, '報價說明')">💰 報價說明</span>
        <span class="tag" onclick="toggleTag(this, '中英翻譯')">🌐 中英翻譯</span>
        <span class="tag" onclick="toggleTag(this, '忽發奇想')">💭 忽發奇想</span>
      </div>
      <div class="checkbox-container">
        <input type="checkbox" id="chkMemory">
        <label for="chkMemory" style="margin:0;cursor:pointer;">☑️ 呼喚過往點子庫（結合歷史記錄）</label>
      </div>
      <label>輸入問題或構想：</label>
      <textarea id="aiInput" placeholder="純白輸入框，請在此輸入..."></textarea>
      <button class="btn" onclick="askAI()">✨ 送出查詢</button>
      <div class="reply-area" id="aiReply">等待查詢...</div>
      <button class="btn btn-outline" id="btnTransfer" style="display:none;" onclick="transferIdea()">📌 轉移此內容到「點子記錄」編輯</button>
    </div>
  </div>

  <!-- P2：點子筆記 -->
  <div id="page-idea" class="page-tab">
    <div class="box">
      <div class="box-title">💡 公司點子編輯與歸檔</div>
      <label>點子主題：</label>
      <input type="text" id="ideaTitle" placeholder="例如：新屋苑優惠">
      <label>詳細內容：</label>
      <textarea id="ideaContent" style="min-height: 100px;" placeholder="寫下你的想法..."></textarea>
      <div class="btn-group">
        <button class="btn col" onclick="saveIdea()">💾 儲存試算表</button>
        <button class="btn btn-outline col" onclick="loadRecent('load_ideas', 'ideaReply')">📖 載入歷史清單</button>
      </div>
      <div class="reply-area" id="ideaReply">點擊載入歷史清單可查看記錄。</div>
    </div>
  </div>

  <!-- P3：思維相簿 (靈感) -->
  <div id="page-inspire" class="page-tab">
    <div class="box">
      <div class="box-title">📸 思維相簿（靈感 / 工藝參考）</div>
      <label>📷 拍攝現場參考照：</label>
      <div class="upload-zone" onclick="document.getElementById('inspFile').click()">
        <span id="inspHint">點此拍攝或選取照片</span>
      </div>
      <input type="file" id="inspFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this, 'inspHint')">
      
      <label>靈感主題：</label>
      <input type="text" id="inspTitle" placeholder="例如：廚櫃暗抽手收口">
      <label>參考價值與備忘：</label>
      <textarea id="inspContent" placeholder="記錄為何要拍、日後可如何應用..."></textarea>
      
      <div class="btn-group">
        <button class="btn col" id="btnSaveInsp" onclick="uploadPhotoForm('inspiration')">💾 儲存相片靈感</button>
        <button class="btn btn-outline col" onclick="loadRecent('load_inspiration', 'inspReply')">📖 載入近期靈感</button>
      </div>
      <div class="reply-area" id="inspReply">點擊載入可查看。</div>
    </div>
  </div>

  <!-- P4：客訴相簿 (存證) -->
  <div id="page-complaint" class="page-tab">
    <div class="box">
      <div class="box-title">💢 客訴相簿（存證與跟進）</div>
      <label>📷 拍攝瑕疵 / 現場存證照：</label>
      <div class="upload-zone" onclick="document.getElementById('compFile').click()">
        <span id="compHint">點此拍攝或選取存證照</span>
      </div>
      <input type="file" id="compFile" accept="image/*" style="display:none;" onchange="handleFileSelect(this, 'compHint')">
      
      <div class="row">
        <div class="col">
          <label>客戶名稱 / 屋苑：</label>
          <input type="text" id="compClient" placeholder="如：太古城陳生">
        </div>
        <div class="col">
          <label>投訴類型：</label>
          <select id="compType">
            <option value="延誤">延誤</option>
            <option value="刮花瑕疵">刮花瑕疵</option>
            <option value="尺寸偏差">尺寸偏差</option>
            <option value="設計爭議">設計爭議</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>
      
      <label>問題描述與承諾對策：</label>
      <textarea id="compContent" placeholder="詳述投訴焦點與答應客人的解決時效..."></textarea>
      
      <div class="btn-group">
        <button class="btn col" id="btnSaveComp" onclick="uploadPhotoForm('complaint')">💾 儲存客訴存證</button>
        <button class="btn btn-outline col" onclick="loadRecent('load_complaint', 'compReply')">📖 載入待處理案件</button>
      </div>
      <div class="reply-area" id="compReply">點擊載入可查看。</div>
    </div>
  </div>

  <!-- P5：支出記帳 (雙欄三列 + OCR) -->
  <div id="page-expense" class="page-tab">
    <div class="box">
      <div class="box-title">📝 支出記帳（自動帶入）</div>
      
      <label>📷 單據照片（置頂上傳，自動 OCR）：</label>
      <div class="upload-zone" onclick="document.getElementById('expFile').click()">
        <span id="uploadHint">點此拍照或選取收據</span>
      </div>
      <input type="file" id="expFile" accept="image/*" style="display:none;" onchange="handleReceiptOCR(this)">

      <div class="row">
        <div class="col"><label>日期：</label><input type="date" id="expDate"></div>
        <div class="col">
          <label>分類：</label>
          <select id="expCategory" onchange="toggleOtherCategory(this.value)">
            <option value="材料採購">材料採購</option>
            <option value="工具設備">工具設備</option>
            <option value="餐飲伙食">餐飲伙食</option>
            <option value="交通泊車">交通泊車</option>
            <option value="租金雜費">租金雜費</option>
            <option value="人工支出">人工支出</option>
            <option value="維修保養">維修保養</option>
            <option value="其他">其他</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col"><label>商戶 / 對象：</label><input type="text" id="expMerchant" placeholder="新興五金"></div>
        <div class="col"><label>金額 (HKD)：</label><input type="number" id="expAmount" step="0.01" placeholder="0.00"></div>
      </div>

      <div class="row">
        <div class="col">
          <label>支付方式：</label>
          <select id="expPayment">
            <option value="現金">現金</option>
            <option value="FPS 轉數快">FPS 轉數快</option>
            <option value="信用卡">信用卡</option>
            <option value="公司戶口">公司戶口</option>
          </select>
        </div>
        <div class="col">
          <label>自訂/補充分類：</label>
          <input type="text" id="expOtherCat" placeholder="選「其他」填寫" disabled>
        </div>
      </div>

      <label>備註：</label>
      <input type="text" id="expNotes" placeholder="選填補充事項">

      <button class="btn" id="btnSaveExp" onclick="uploadPhotoForm('expense')">💾 確認無誤，儲存開支</button>
      <div class="reply-area" id="expStatus" style="display:none;"></div>
    </div>
  </div>

  <!-- P6：日曆待辦 (加入臨時記事區與新排版) -->
  <div id="page-calendar" class="page-tab">
    
    <!-- 緩衝區：未排期的 TODO -->
    <div class="box" style="margin-bottom: 12px; background: #d0d0d0;">
      <div class="box-title" style="border-bottom: 1px dashed #333;">📝 臨時記事 (未排期 TODO)</div>
      <textarea id="calDraft" style="min-height: 70px; background: #fff; border: 1px dashed #555;" placeholder="隨手記下尚未確認時間的工程、待回覆客人..."></textarea>
      <button class="btn btn-outline" onclick="saveCalDraft()" style="padding: 8px; font-size: 13px;">💾 儲存臨時記事</button>
    </div>

    <!-- 正式排期區 -->
    <div class="box">
      <div class="box-title">📅 日曆與待辦</div>
      <div class="btn-group" style="margin-bottom:8px;">
        <button class="btn btn-outline col" onclick="loadRecent('load_calendar', 'calReply')">📅 載入行程檔期</button>
        <button class="btn col" onclick="addCalEvent()">➕ 加入日曆</button>
      </div>
      <div class="reply-area" id="calReply" style="margin-top:0; margin-bottom:8px;">(查閱前2天至後3週之行程)</div>
      
      <label>選定日期與時間：</label>
      <input type="datetime-local" id="calTime">
      <label>行程標題：</label>
      <input type="text" id="calTitle" placeholder="例如：太古城陳生安裝">
    </div>
  </div>

  <!-- 底部 6 格導航列 -->
  <div class="navbar">
    <div class="nav-btn active" id="nav-btn-ai" onclick="switchPage('ai', '🤖 AI 助理')">
      <span class="icon">🤖</span><span>AI 助理</span>
    </div>
    <div class="nav-btn" id="nav-btn-idea" onclick="switchPage('idea', '💡 點子')">
      <span class="icon">💡</span><span>點子</span>
    </div>
    <div class="nav-btn" id="nav-btn-inspire" onclick="switchPage('inspire', '📸 靈感')">
      <span class="icon">📸</span><span>靈感</span>
    </div>
    <div class="nav-btn" id="nav-btn-complaint" onclick="switchPage('complaint', '💢 客訴')">
      <span class="icon">💢</span><span>客訴</span>
    </div>
    <div class="nav-btn" id="nav-btn-expense" onclick="switchPage('expense', '📝 記帳')">
      <span class="icon">📝</span><span>記帳</span>
    </div>
    <div class="nav-btn" id="nav-btn-calendar" onclick="switchPage('calendar', '📅 日曆')">
      <span class="icon">📅</span><span>日曆</span>
    </div>
  </div>

  <script>
    // 你的 Apps Script 部署 URL (請確認為最新版本 URL)
    const API_URL = "https://script.google.com/macros/s/AKfycbyFY5fI-DuqNLF_FE3E4NAli_IaFiZ5hKEiDJRaKdrjcGKpm0-P32UNEXZ6BUsQVwP0/exec";

    document.getElementById('expDate').value = new Date().toISOString().split('T')[0];
    var fileData = { expense: "", inspiration: "", complaint: "" };

    // 分頁切換 (含日曆草稿自動載入)
    function switchPage(pageKey, title) {
      var pages = document.getElementsByClassName('page-tab');
      for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
      var btns = document.getElementsByClassName('nav-btn');
      for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');

      document.getElementById('page-' + pageKey).classList.add('active');
      document.getElementById('nav-btn-' + pageKey).classList.add('active');
      document.getElementById('topTitle').innerText = title;
      window.scrollTo(0, 0);

      if (pageKey === 'calendar') loadCalDraft();
    }

    // JSONP 通訊 (純文字防阻擋)
    function callJSONP(payload) {
      return new Promise(function(resolve, reject) {
        var cbName = "cb_" + Math.round(1000000 * Math.random());
        window[cbName] = function(res) {
          delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(res);
        };
        var script = document.createElement("script");
        script.src = API_URL + "?callback=" + cbName + "&data=" + encodeURIComponent(JSON.stringify(payload));
        script.onerror = function() { reject(new Error("網路連線逾時")); };
        document.body.appendChild(script);
      });
    }

    // AI 助理多選
    var selectedTags = [];
    function toggleTag(el, tagText) {
      var index = selectedTags.indexOf(tagText);
      if (index === -1) { selectedTags.push(tagText); el.classList.add('selected'); } 
      else { selectedTags.splice(index, 1); el.classList.remove('selected'); }
      
      var input = document.getElementById('aiInput');
      input.value = selectedTags.length > 0 ? "請綜合針對【" + selectedTags.join(" + ") + "】面向給出建議：\n" : "";
      input.focus();
    }

    var lastPrompt = "", lastReply = "";
    function askAI() {
      var prompt = document.getElementById('aiInput').value.trim();
      var useMem = document.getElementById('chkMemory').checked;
      var replyBox = document.getElementById('aiReply');
      var transferBtn = document.getElementById('btnTransfer');
      if (!prompt) return alert("請輸入問題！");
      replyBox.innerText = "⏳ 思考處理中...";
      transferBtn.style.display = "none";

      callJSONP({ action: "ai_ask", prompt: prompt, useMemory: useMem }).then(function(res) {
        replyBox.innerText = res.reply;
        lastPrompt = prompt; lastReply = res.reply;
        transferBtn.style.display = "block";
      }).catch(function(err) { replyBox.innerText = "❌ 錯誤: " + err.message; });
    }

    function transferIdea() {
      document.getElementById('ideaTitle').value = lastPrompt.substring(0, 30);
      document.getElementById('ideaContent').value = "【問題】\n" + lastPrompt + "\n\n【建議】\n" + lastReply;
      switchPage('idea', '💡 點子');
    }

    // 點子存儲
    function saveIdea() {
      var title = document.getElementById('ideaTitle').value.trim();
      var content = document.getElementById('ideaContent').value.trim();
      var rb = document.getElementById('ideaReply');
      if (!content) return alert("請輸入內容！");
      rb.innerText = "⏳ 儲存中...";
      callJSONP({ action: "save_idea", title: title, content: content }).then(function(res) {
        alert(res.message); rb.innerText = res.message;
      }).catch(function(err) { rb.innerText = "❌ 錯誤: " + err.message; });
    }

    // 共用載入清單
    function loadRecent(actionName, replyBoxId) {
      var rb = document.getElementById(replyBoxId);
      rb.innerText = "⏳ 載入中...";
      callJSONP({ action: actionName }).then(function(res) {
        rb.innerText = res.reply;
      }).catch(function(err) { rb.innerText = "❌ 錯誤: " + err.message; });
    }

    // 日曆草稿 TODO
    function saveCalDraft() {
      var content = document.getElementById('calDraft').value;
      var btn = event.target;
      var originalText = btn.innerText;
      btn.innerText = "⏳ 儲存中...";
      callJSONP({ action: "save_cal_draft", content: content }).then(function(res) {
        btn.innerText = res.message;
        setTimeout(function(){ btn.innerText = originalText; }, 2000);
      }).catch(function(err) { alert("❌ 儲存失敗"); btn.innerText = originalText; });
    }

    function loadCalDraft() {
      callJSONP({ action: "load_cal_draft" }).then(function(res) {
        if (res.status === "success" && res.reply) document.getElementById('calDraft').value = res.reply;
      });
    }

    // 行事曆新增
    function addCalEvent() {
      var title = document.getElementById('calTitle').value;
      var time = document.getElementById('calTime').value;
      if (!title || !time) return alert("請填寫標題及時間！");
      callJSONP({ action: "add_calendar", title: title, time: time }).then(function(res) {
        alert(res.message); document.getElementById('calTitle').value = '';
      }).catch(function(err) { alert("❌ 新增失敗"); });
    }

    // 通用圖片選取
    function handleFileSelect(input, hintId) {
      if (!input.files || input.files.length === 0) return;
      var hint = document.getElementById(hintId);
      hint.innerText = "⏳ 載入照片中...";
      var reader = new FileReader();
      reader.onload = function(e) {
        var base64 = e.target.result.split(',')[1];
        if(hintId === 'inspHint') { fileData.inspiration = base64; hint.innerText = "✅ 靈感照片已備妥"; }
        if(hintId === 'compHint') { fileData.complaint = base64; hint.innerText = "✅ 存證照片已備妥"; }
      };
      reader.readAsDataURL(input.files[0]);
    }

    // OCR 記帳相片讀取
    function handleReceiptOCR(input) {
      if (!input.files || input.files.length === 0) return;
      var hint = document.getElementById('uploadHint');
      hint.innerText = "⏳ 辨識中...";
      var reader = new FileReader();
      reader.onload = function(e) {
        fileData.expense = e.target.result.split(',')[1];
        Tesseract.recognize(e.target.result, 'chi_tra+eng', { logger: m => { if (m.status === 'recognizing text') hint.innerText = "⏳ 進度：" + Math.round(m.progress * 100) + "%"; }})
        .then(function(result) {
          var text = result.data.text;
          hint.innerText = "✅ 辨識完成！請核對。";
          var amt = text.match(/(?:HKD|\$|Total|總額|金額)\s*[:：]?\s*(\d+[.,]\d{2}|\d+)/i) || text.match(/(\d+\.\d{2})/);
          if (amt && amt[1]) document.getElementById('expAmount').value = amt[1].replace(',', '');
          var dt = text.match(/(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})/);
          if (dt && dt[1]) document.getElementById('expDate').value = dt[1].replace(/[\/.]/g, '-');
          var lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 2);
          if (lines.length > 0 && !document.getElementById('expMerchant').value) document.getElementById('expMerchant').value = lines[0].substring(0, 15);
        }).catch(function(err) { hint.innerText = "⚠️ 照片備妥 (手動核對欄位)"; });
      };
      reader.readAsDataURL(input.files[0]);
    }

    function toggleOtherCategory(val) {
      var otherInput = document.getElementById('expOtherCat');
      otherInput.disabled = (val !== "其他");
      if(val === "其他") otherInput.focus(); else otherInput.value = "";
    }

    // 表單 POST 送出 (處理照片上傳)
    function uploadPhotoForm(type) {
      var payload = { action: type };
      var btn, statusBox;
      
      if (type === 'expense') {
        payload.date = document.getElementById('expDate').value;
        payload.category = document.getElementById('expCategory').value;
        if(payload.category === "其他") payload.category += "("+document.getElementById('expOtherCat').value+")";
        payload.merchant = document.getElementById('expMerchant').value;
        payload.amount = document.getElementById('expAmount').value;
        payload.payment = document.getElementById('expPayment').value;
        payload.notes = document.getElementById('expNotes').value;
        payload.imageBase64 = fileData.expense;
        if(!payload.amount) return alert("請輸入金額");
        btn = document.getElementById('btnSaveExp');
        statusBox = document.getElementById('expStatus');
      } else if (type === 'inspiration') {
        payload.title = document.getElementById('inspTitle').value;
        payload.content = document.getElementById('inspContent').value;
        payload.imageBase64 = fileData.inspiration;
        if(!payload.title) return alert("請填寫靈感主題");
        btn = document.getElementById('btnSaveInsp');
      } else if (type === 'complaint') {
        payload.client = document.getElementById('compClient').value;
        payload.type = document.getElementById('compType').value;
        payload.content = document.getElementById('compContent').value;
        payload.imageBase64 = fileData.complaint;
        if(!payload.client) return alert("請填寫客戶名稱");
        btn = document.getElementById('btnSaveComp');
      }

      btn.disabled = true;
      var originalText = btn.innerText;
      btn.innerText = "⏳ 上傳與歸檔中...";
      if(statusBox) { statusBox.style.display = "block"; statusBox.innerText = "處理中..."; }

      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ "postData": JSON.stringify(payload) })
      }).then(r => r.json()).then(res => {
        btn.disabled = false; btn.innerText = originalText;
        if (res.status === "success") {
          alert(res.message);
          if(statusBox) statusBox.innerText = res.message;
          fileData[type] = "";
          if(type==='expense'){ ['expMerchant','expAmount','expOtherCat','expNotes'].forEach(id => document.getElementById(id).value=''); document.getElementById('uploadHint').innerText="點此拍照或選取收據"; }
          if(type==='inspiration'){ ['inspTitle','inspContent'].forEach(id => document.getElementById(id).value=''); document.getElementById('inspHint').innerText="點此拍攝照片"; }
          if(type==='complaint'){ ['compClient','compContent'].forEach(id => document.getElementById(id).value=''); document.getElementById('compHint').innerText="點此拍攝照片"; }
        } else {
          alert("❌ 失敗: " + res.message);
        }
      }).catch(err => {
        btn.disabled = false; btn.innerText = originalText;
        alert("⚠️ 已提交，請檢查試算表。");
      });
    }
  </script>
</body>
</html>
