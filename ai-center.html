<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 專屬指揮中心</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; color: #4A90E2; text-align: center; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; margin-bottom: 15px; resize: none; }
        .btn { display: block; width: 100%; padding: 15px; text-align: center; background-color: #4A90E2; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-bottom: 12px; font-weight: bold; }
        .btn:hover { background-color: #357ABD; }
        .btn-green { background-color: #2ECC71; }
        .btn-orange { background-color: #F39C12; }
        .file-input-wrapper { margin-bottom: 15px; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #ccc; border-radius: 8px; box-sizing: border-box; background: #fafafa; }
        .links { display: flex; gap: 10px; margin-top: 20px; }
        .links a { flex: 1; text-align: center; padding: 12px 5px; background: #f0f0f0; color: #333; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 AI 指揮中心 (相機版)</h1>
        
        <!-- 圖片上傳區 -->
        <div class="file-input-wrapper">
            <label style="font-size: 14px; color: #666; font-weight:bold; display:block; margin-bottom:5px;">📷 拍下收據或選擇圖片：</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment">
        </div>

        <textarea id="userInput" placeholder="寫下金額、項目，或你的待辦、點子..."></textarea>

        <button class="btn btn-orange" id="uploadBtn" onclick="uploadImage()">☁️ 1. 上傳圖片並自動記帳</button>
        <button class="btn" onclick="generatePrompt()">🪄 2. 文字打包成 AI 指令</button>
        <a href="https://gemini.google.com/" target="_blank" class="btn btn-green" style="text-decoration: none; box-sizing: border-box;">🤖 3. 打開 AI 處理</a>

        <div class="links">
            <a href="https://docs.google.com/spreadsheets/d/1FIGvKLNDxsuD0ea-37icGfyINNkrXzGDziY7VbQ-Acc/edit" target="_blank">📊 理財記帳本</a>
            <a href="https://docs.google.com/spreadsheets/d/1FU-_cU6SUcbt4Z28P3LnNDUC-pOaAyiLB9rtrNYQRlo/edit" target="_blank">💡 生意點子庫</a>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxcLThDpbk1qebQqGoW51VB4O7SiDR3XIZ54-KJZN-eox3d_CxN2YsA8mPl-31sCBXA/exec";

        // 記憶功能
        const inputField = document.getElementById('userInput');
        window.onload = function() {
            if(localStorage.getItem('myMindRecord')) {
                inputField.value = localStorage.getItem('myMindRecord');
            }
        }
        inputField.addEventListener('input', function() {
            localStorage.setItem('myMindRecord', inputField.value);
        });

        // 圖片上傳功能
        function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            const note = document.getElementById('userInput').value || '未命名收據';

            if (!file) {
                alert("請先選擇一張照片喔！");
                return;
            }

            const uploadBtn = document.getElementById('uploadBtn');
            uploadBtn.innerText = "⏳ 上傳雲端中...請稍候";
            uploadBtn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result.split(',')[1];
                const payload = { imageBase64: base64String, filename: file.name, note: note };

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        alert('✅ 上傳成功！圖片已存入 Google Drive，並寫入記帳本。');
                        fileInput.value = '';
                        inputField.value = '';
                        localStorage.removeItem('myMindRecord');
                    } else {
                        alert('❌ 上傳失敗：' + data.message);
                    }
                })
                .catch(error => {
                    alert('❌ 發生錯誤：' + error);
                })
                .finally(() => {
                    uploadBtn.innerText = "☁️ 1. 上傳圖片並自動記帳";
                    uploadBtn.disabled = false;
                });
            };
            reader.readAsDataURL(file);
        }

        // 打包指令功能
        function generatePrompt() {
            const text = inputField.value;
            if(!text) { alert('請先輸入一點內容喔！'); return; }
            const prompt = `【請啟動我的專屬教練團】\n以下是我現在遇到的狀況：\n「${text}」\n\n請切換適合的角色幫我處理：\n1. 冷酷秘書\n2. 行動教練\n3. 記帳管家\n4. 生意智囊\n5. 流程架構師`;
            navigator.clipboard.writeText(prompt).then(() => {
                alert('✅ 指令已打包！請點擊下方綠色按鈕貼給 AI。');
                inputField.value = ''; localStorage.removeItem('myMindRecord');
            });
        }
    </script>
</body>
</html>
