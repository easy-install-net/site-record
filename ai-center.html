<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 中心</title>
  <style>
    /* 整體字體加大 + 方形黑粗框硬派風格 */
    * { box-sizing: border-box; font-family: -apple-system, sans-serif; font-size: 17px; /* 字體加大 */ }
    body { background-color: #fff; margin: 0; padding: 2px; padding-bottom: 60px; color: #000; } /* 外部 Padding 減到極致 */
    
    /* 標題與卡片：全改為黑框方形 */
    .header { background: #000; color: #fff; padding: 8px; text-align: center; font-weight: bold; margin-bottom: 4px; border: 2px solid #000; }
    .card { background: #fff; padding: 4px; margin-bottom: 4px; border: 2px solid #000; }
    
    label { font-size: 15px; font-weight: bold; color: #000; margin-bottom: 2px; display: block; }
    .form-group { margin-bottom: 6px; }
    
    /* 輸入框放大 + 方形黑框 */
    input, select, textarea { 
      width: 100%; 
      padding: 12px 8px; /* 內部高度放大，更好點擊與輸入 */
      border: 2px solid #000; 
      border-radius: 0; /* 零圓角 */
      outline: none; 
      font-weight: bold;
      background: #fff; 
    }
    input:focus, textarea:focus { background: #ffffd0; /* 點擊輸入時會亮黃底，防看錯 */ }
    
    /* 日期 3 格 */
    .date-row { display: flex; gap: 4px; }
    .date-row input { text-align: center; font-weight: bold; padding: 12px 4px; }
    
    /* 緊湊按鈕晶片 - 方形黑框 */
    .btn-group { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 2px; }
    .chip { 
      padding: 8px 10px; 
      border-radius: 0; 
      font-size: 15px; 
      background: #fff; 
      border: 2px solid #000; 
      color: #000; 
      cursor: pointer; 
      font-weight: bold; 
    }
    .chip.active { background: #000; color: #fff; }
    /* 工作類別底色微灰區分 */
    .chip.biz { background: #e0e0e0; }
    .chip.biz.active { background: #000; color: #fff; }
    
    .preview-box { width: 100%; max-height: 120px; object-fit: contain; margin-top: 4px; display: none; border: 2px solid #000; }
    
    /* 提交按鈕放大 */
    .submit-btn { width: 100%; padding: 14px; background: #000; color: #fff; border: 2px solid #000; border-radius: 0; font-weight: bold; font-size: 18px; cursor: pointer; }
    .submit-btn:disabled { background: #666; border-color: #666; }
    .status-msg { margin-top: 4px; text-align: center; font-size: 14px; font-weight: bold; }
    
    /* 底部導覽 - 方形黑框分隔 */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; display: flex; border-top: 2px solid #000; z-index: 100; }
    .nav-item { flex: 1; text-align: center; padding: 14px 0; font-size: 16px; color: #000; cursor: pointer; font-weight: bold; border-right: 2px solid #000; }
    .nav-item:last-child { border-right: none; }
    .nav-item.active { background: #000; color: #fff; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .ai-response { background: #fff; padding: 12px; font-size: 16px; min-height: 80px; border: 2px solid #000; margin-top: 6px; white-space: pre-wrap; font-weight: bold; }
  </style>
</head>
<body>

<div class="header" id="headerTitle">💰 記帳與物料</div>

<!-- 分頁 1: 記帳 -->
<div id="tab-expense" class="tab-content active">
  <div class="card">
    <div class="form-group">
      <label>📅 日期 (年/月/日)</label>
      <div class="date-row">
        <input type="number" id="year" placeholder="年" style="flex: 1.2;">
        <input type="number" id="month" placeholder="月" style="flex: 1;">
        <input type="number" id="day" placeholder="日" style="flex: 1;">
      </div>
    </div>
    <div class="form-group">
      <label>🏷️ 分類</label>
      <div class="btn-group">
        <div class="chip biz active" onclick="selectCategory(this, '供應商訂購物料')">📦 供應商</div>
        <div class="chip biz" onclick="selectCategory(this, '工地/現場雜支')">🔧 工地</div>
        <div class="chip biz" onclick="selectCategory(this, '業務/交際')">💼 業務</div>
        <div class="chip" onclick="selectCategory(this, '餐飲')">🍽️ 餐飲</div>
        <div class="chip" onclick="selectCategory(this, '交通/油費')">🚗 交通</div>
        <div class="chip" onclick="selectCategory(this, '超市/日常')">🛒 超市</div>
        <div class="chip" onclick="selectCategory(this, '其他')">➕ 其他</div>
      </div>
      <input type="hidden" id="selectedCategory" value="供應商訂購物料">
    </div>
    <div class="date-row">
      <div class="form-group" style="flex:1;">
        <label>💰 金額 (留空AI猜)</label>
        <input type="number" step="any" id="amount" placeholder="金額">
      </div>
      <div class="form-group" style="flex:1.5;">
        <label>🏢 店家/供應商</label>
        <input type="text" id="merchant" placeholder="店家名稱">
      </div>
    </div>
    <div class="form-group">
      <label>💳 方式</label>
      <div class="btn-group">
        <div class="chip active" onclick="selectPayment(this, '公司帳戶')">公司</div>
        <div class="chip" onclick="selectPayment(this, '現金')">現金</div>
        <div class="chip" onclick="selectPayment(this, '八達通')">八達通</div>
        <div class="chip" onclick="selectPayment(this, '信用卡')">信用卡</div>
        <div class="chip" onclick="selectPayment(this, 'PayMe/FPS')">PayMe</div>
      </div>
      <input type="hidden" id="paymentMethod" value="公司帳戶">
    </div>
    <div class="form-group">
      <label>📝 用途/備註</label>
      <textarea id="notes" rows="2" placeholder="例如: 批盪灰 2 包"></textarea>
    </div>
    <div class="form-group">
      <label>📷 單據拍照</label>
      <input type="file" id="receiptImg" accept="image/*" capture="environment">
      <img id="preview" class="preview-box">
    </div>
    <button class="submit-btn" id="submitBtn" onclick="submitData()">💾 儲存並寫入</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

<!-- 分頁 2: AI 助理 -->
<div id="tab-ai" class="tab-content">
  <div class="card">
    <label>🤖 詢問 AI (分析、建議、翻譯)</label>
    <textarea id="aiPrompt" rows="4" placeholder="請輸入問題..."></textarea>
    <button class="submit-btn" onclick="askAI()" style="background:#000; margin-top:4px;">✨ 送出給 AI</button>
    <label style="margin-top:10px;">💡 AI 回覆：</label>
    <div class="ai-response" id="aiResult">等待輸入...</div>
  </div>
</div>

<!-- 分頁 3: 日曆 -->
<div id="tab-calendar" class="tab-content">
  <div class="card">
    <label>➕ 新增 Google Calendar 行程</label>
    <input type="text" id="taskTitle" placeholder="事項 (例: 下午開會)" style="margin-bottom:4px;">
    <input type="datetime-local" id="taskTime" style="margin-bottom:4px;">
    <button class="submit-btn" onclick="addCalendar()">📅 加入行事曆</button>
    <div class="status-msg" id="calMsg"></div>
  </div>
  <div class="card">
    <label>📋 近期行程</label>
    <div class="ai-response" id="calendarList">點擊下方載入...</div>
    <button class="submit-btn" onclick="loadCalendar()" style="background:#fff; color:#000; margin-top:4px;">🔄 載入行程</button>
  </div>
</div>

<!-- 底部導覽列 -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('expense', '💰 記帳與物料', this)">🧾 記帳</div>
  <div class="nav-item" onclick="switchTab('ai', '🤖 AI 助理', this)">✨ AI 助理</div>
  <div class="nav-item" onclick="switchTab('calendar', '📅 日曆待辦', this)">📆 日曆</div>
</div>

<script>
  // ✅ 你的真實 GAS URL (不需修改)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxcLThDpbk1qebQqGoW51VB4O7SiDR3XIZ54-KJZN-eox3d_CxN2YsA8mPl-31sCBXA/exec";

  const today = new Date();
  document.getElementById('year').value = today.getFullYear();
  document.getElementById('month').value = String(today.getMonth() + 1).padStart(2, '0');
  document.getElementById('day').value = String(today.getDate()).padStart(2, '0');

  function switchTab(tabId, title, element) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('tab-' + tabId).classList.add('active');
    element.classList.add('active');
    document.getElementById('headerTitle').innerText = title;
  }

  function selectCategory(el, val) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('selectedCategory').value = val;
  }
  function selectPayment(el, val) {
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('paymentMethod').value = val;
  }

  let base64String = "";
  document.getElementById('receiptImg').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(event) {
        base64String = event.target.result.split(',')[1];
        const preview = document.getElementById('preview');
        preview.src = event.target.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  });

  async function submitData() {
    const y = document.getElementById('year').value.trim();
    const m = String(document.getElementById('month').value.trim()).padStart(2, '0');
    const d = String(document.getElementById('day').value.trim()).padStart(2, '0');
    const fullDate = `${y}-${m}-${d}`;
    const shortDate = `${y.slice(-2)}${m}${d}`; 

    const payload = {
      action: "expense",
      date: fullDate,
      category: document.getElementById('selectedCategory').value,
      amount: document.getElementById('amount').value.trim(),
      merchant: document.getElementById('merchant').value.trim(),
      payment: document.getElementById('paymentMethod').value,
      notes: document.getElementById('notes').value.trim(),
      imageBase64: base64String,
      filename: `${shortDate}-${document.getElementById('amount').value.trim() || "待定"}-${document.getElementById('merchant').value.trim() || "未命名"}.jpg`
    };

    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('statusMsg');
    btn.disabled = true; msg.style.color = "blue"; msg.innerText = "寫入中...";

    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
      const data = await res.json();
      if (data.status === "success") {
        msg.style.color = "green"; msg.innerText = `✅ 成功！`;
        document.getElementById('amount').value = ""; document.getElementById('merchant').value = "";
        document.getElementById('notes').value = ""; document.getElementById('receiptImg').value = "";
        document.getElementById('preview').style.display = "none"; base64String = "";
      } else {
        msg.style.color = "red"; msg.innerText = "❌ " + data.message;
      }
    } catch (err) {
      msg.style.color = "red"; msg.innerText = "❌ 網路錯誤";
    } finally { btn.disabled = false; }
  }

  async function askAI() {
    const prompt = document.getElementById('aiPrompt').value.trim();
    const resBox = document.getElementById('aiResult');
    if (!prompt) return resBox.innerText = "請輸入問題！";
    
    resBox.innerText = "⏳ AI 思考中...";
    try {
      const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "ai_ask", prompt: prompt }) });
