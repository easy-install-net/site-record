<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>控制中心</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif; }
    body { background-color: #fff; color: #000; padding: 8px 8px 70px 8px; font-size: 16px; line-height: 1.35; }
    
    /* 頂部黑框標題 */
    .header { border: 2px solid #000; padding: 8px; text-align: center; font-size: 18px; font-weight: 900; letter-spacing: 1px; margin-bottom: 8px; background: #fff; }

    /* 分頁顯示控制 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 黑白極簡卡片容器：減小 padding */
    .box { border: 2px solid #000; padding: 8px; margin-bottom: 8px; background: #fff; }
    .box-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; border-bottom: 1.5px solid #000; padding-bottom: 4px; display: flex; align-items: center; gap: 5px; }

    /* 表單元件：大字體、緊湊邊距、黑框 */
    label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 3px; margin-top: 4px; }
    input, select, textarea {
      width: 100%;
      padding: 7px;
      font-size: 16px;
      border: 1.5px solid #000;
      border-radius: 0;
      outline: none;
      background: #fff;
      color: #000;
      margin-bottom: 5px;
      -webkit-appearance: none;
    }
    textarea { resize: vertical; min-height: 95px; font-size: 15px; }

    /* 黑框線按鈕 */
    .btn {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #000;
      background: #000;
      color: #fff;
      cursor: pointer;
      margin-top: 5px;
      border-radius: 0;
      display: block;
      text-align: center;
    }
    .btn:active { background: #333; }
    .btn-outline { background: #fff; color: #000; }
    .btn-outline:active { background: #eee; }

    /* 快捷分類標籤（黑框線膠囊） */
    .tag-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
    .tag {
      border: 1.5px solid #000;
      background: #fff;
      color: #000;
      padding: 3px 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .tag:active { background: #000; color: #fff; }

    /* 回覆與顯示區塊（黑框簡約） */
    .reply-area {
      border: 1.5px dashed #000;
      padding: 6px;
      margin-top: 6px;
      font-size: 15px;
      min-height: 40px;
      white-space: pre-wrap;
      word-break: break-all;
      background: #fafafa;
    }

    /* 底部固定導航列 */
    .navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      background: #fff;
      border-top: 2px solid #000;
      display: flex;
      z-index: 999;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #777;
      border-right: 1px solid #eee;
      cursor: pointer;
      background: #fff;
    }
    .nav-btn:last-child { border-right: none; }
    .nav-btn.active {
      color: #000;
      background: #f0f0f0;
      border-top: 3px solid #000;
    }
    .nav-btn .icon { font-size: 16px; margin-bottom: 2px; }
  </style>
</head>
<body>

  <div class="header" id="pageTitle">🤖 AI 助理</div>

  <!-- 分頁 1：AI 助理 -->
  <div id="tab-ai" class="tab-content active">
    <div class="box">
      <div class="box-title">⚡ 快速引導分類</div>
      <div class="tag-container">
        <span class="tag" onclick="quickFill('公司點子：我想推廣新屋苑工程業務，有咩拓展點子？')">💡 推廣點子</span>
        <span class="tag" onclick="quickFill('公司點子：如何與室內設計師或五金舖建立長期合作分成？')">🤝 異業合作</span>
        <span class="tag" onclick="quickFill('客人投訴工程延誤一日，仲好生氣，應該點樣得體覆佢？')">💢 客訴應對</span>
        <span class="tag" onclick="quickFill('客人問點解報價比出面貴少少，如何解釋物料同手工價值？')">💰 報價回覆</span>
        <span class="tag" onclick="quickFill('請幫我將以下對話翻譯為英文：今日下午 3 點師傅會到現場檢查水喉。')">🌐 中英翻譯</span>
      </div>

      <label>輸入問題或構想：</label>
      <textarea id="aiInput" placeholder="點擊上方標籤或直接打字..."></textarea>
      <button class="btn" onclick="askAI()">✨ 送出查詢</button>

      <div class="reply-area" id="aiResult">等待輸入...</div>
      <button class="btn btn-outline" id="btnCopyIdea" style="display:none;" onclick="copyToIdeaTab()">📌 轉移此內容到「點子記錄」編輯</button>
    </div>
  </div>

  <!-- 分頁 2：點子記錄與修改 -->
  <div id="tab-ideas" class="tab-content">
    <div class="box">
      <div class="box-title">💡 公司點子編輯與歸檔</div>
      
      <label>主題 / 項目標題：</label>
      <input type="text" id="ideaTitle" placeholder="例如：新屋苑二人同行優惠">

      <label>詳細內容（可隨意修改增減）：</label>
      <textarea id="ideaBody" style="min-height: 120px;" placeholder="在此輸入或貼上修改你的想法..."></textarea>

      <!-- 操作按鈕 -->
      <button class="btn" onclick="saveIdea()">💾 儲存到 Google 試算表</button>
      <button class="btn btn-outline" onclick="fetchIdeas()">📖 載入歷史點子清單</button>

      <div class="reply-area" id="ideaList">點擊「載入歷史點子清單」可查看過往記錄。</div>
    </div>
  </div>

  <!-- 分頁 3：記帳 -->
  <div id="tab-expense" class="tab-content">
    <div class="box">
      <div class="box-title">📝 支出記帳</div>
      
      <label>日期：</label>
      <input type="date" id="expDate">

      <label>類別：</label>
      <select id="expCategory">
        <option value="材料採購">材料採購</option>
        <option value="工具設備">工具設備</option>
        <option value="餐飲伙食">餐飲伙食</option>
        <option value="交通泊車">交通泊車</option
