<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地盤物資與工程筆記管理系統</title>
    
    <!-- 引入手寫筆記風字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 引入 Firebase v8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #1e3a8a; 
            --bg: #f5f4ef; 
            --card-bg: #fffdfa;
            --text: #292524; 
            --text-sub: #78716c;
            --border: #e7e5e4;
            --btn-none: #78716c;
            --btn-tobuy: #ea580c;
            --btn-tosend: #0284c7;
            --btn-onsite: #15803d;
        }
        body { 
            font-family: "Zen Maru Gothic", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 85px; 
            -webkit-tap-highlight-color: transparent;
            background-image: radial-gradient(#e5e5e0 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .header { 
            background: #fffdfa; 
            padding: 10px 12px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            display: flex; 
            gap: 6px; 
            align-items: center; 
            border-bottom: 2px dashed #d6d3d1;
        }
        select, input, button, textarea { 
            font-family: inherit;
            font-size: 13px; 
            padding: 6px 8px; 
            border-radius: 8px; 
            border: 1.5px solid #d6d3d1; 
            outline: none;
            background: #fff;
        }
        select { flex: 1; font-weight: 700; color: var(--primary); }
        .btn-header { background: #1e3a8a; color: white; border: none; font-weight: 600; cursor: pointer; white-space: nowrap; padding: 6px 10px; border-radius: 8px; box-shadow: 1px 2px 0px rgba(0,0,0,0.15); }
        .btn-del-unit { background: #fee2e2; color: #b91c1c; border: 1.5px solid #f87171; font-size: 12px; padding: 6px 8px; border-radius: 8px; cursor: pointer; white-space: nowrap; font-weight: 700; }
        .container { padding: 12px; max-width: 620px; margin: 0 auto; }
        
        /* 底部導覽列 (手寫便籤質感) */
        .tab-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            background: #fffdfa; 
            display: flex; 
            box-shadow: 0 -2px 8px rgba(0,0,0,0.06); 
            z-index: 100; 
            border-top: 2px solid #e7e5e4;
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px 0; 
            font-weight: 700; 
            color: var(--text-sub); 
            cursor: pointer; 
            font-size: 13px; 
        }
        .tab.active { 
            color: var(--primary); 
            border-top: 3px solid var(--primary); 
            background: #fbfbf9;
        }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 分類大標 (A. B. C. 編號風格) */
        .category-title { 
            background: #e7e5e4; 
            padding: 6px 12px; 
            margin: 14px 0 6px 0; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 700; 
            color: #1c1917; 
            position: sticky; 
            top: 50px; 
            z-index: 90; 
            border-left: 4px solid var(--primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }

        /* 項目卡片 */
        .item-card { 
            background: var(--card-bg); 
            padding: 8px 10px; 
            border-radius: 8px; 
            margin-bottom: 6px; 
            border: 1.5px solid #e7e5e4;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 6px; 
            box-shadow: 1px 1px 3px rgba(0,0,0,0.02);
        }
        .item-info { flex: 1; min-width: 0; }
        .item-header-row { display: flex; align-items: baseline; gap: 5px; }
        .item-code { font-family: 'Caveat', cursive, sans-serif; font-size: 16px; font-weight: 700; color: #0284c7; }
        .item-title { font-weight: 700; font-size: 13px; color: #1c1917; }
        .item-desc { font-size: 11px; color: var(--text-sub); line-height: 1.25; margin-top: 1px; }

        /* 四態狀態按鈕：不需 / 待買 / 待送現場 / 送現場 */
        .status-group { display: flex; gap: 3px; flex-shrink: 0; }
        .status-btn { 
            padding: 4px 5px; 
            font-size: 11px; 
            font-weight: 600;
            border: 1.5px solid #d6d3d1; 
            background: #fafaf9; 
            color: #78716c; 
            border-radius: 6px; 
            cursor: pointer; 
            white-space: nowrap;
        }
        .status-btn.s-0.active { background: #e7e5e4; color: #44403c; border-color: #a8a29e; font-weight: 700; }
        .status-btn.s-1.active { background: #ffedd5; color: #c2410c; border-color: #fb923c; font-weight: 700; }
        .status-btn.s-2.active { background: #e0f2fe; color: #0369a1; border-color: #38bdf8; font-weight: 700; }
        .status-btn.s-3.active { background: #dcfce7; color: #15803d; border-color: #4ade80; font-weight: 700; }

        /* 追加自訂物資便籤 */
        .custom-add { 
            background: #fefce8; 
            border: 1.5px dashed #ca8a04; 
            padding: 8px 10px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
        }
        .custom-add-row { display: flex; gap: 6px; }

        /* 日誌卡片 */
        .diary-card { 
            background: var(--card-bg); 
            padding: 12px; 
            border-radius: 10px; 
            border: 1.5px solid #d6d3d1; 
            margin-bottom: 12px; 
            box-shadow: 1px 2px 4px rgba(0,0,0,0.03);
        }
        .diary-form-group { margin-bottom: 8px; }
        .diary-form-group label { display: block; font-size: 12px; font-weight: 700; color: #57534e; margin-bottom: 3px; }
        .diary-form-group input, .diary-form-group select { width: 100%; box-sizing: border-box; }
        .btn-submit { background: #15803d; color: white; border: none; width: 100%; font-weight: 700; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 14px; box-shadow: 1px 2px 0px rgba(0,0,0,0.15); }
        
        .diary-item { 
            background: var(--card-bg); 
            padding: 10px; 
            border-radius: 8px; 
            border: 1.5px solid #e7e5e4; 
            border-left: 5px solid #0284c7; 
            margin-bottom: 8px; 
        }
        .diary-item.expense { border-left-color: #ea580c; }
        .diary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .tag-cat { 
            font-size: 11px; 
            padding: 2px 6px; 
            background: #f5f5f4; 
            color: #44403c; 
            border-radius: 6px; 
            font-weight: 700; 
            border: 1px solid #d6d3d1;
        }
        .diary-date { font-family: 'Caveat', cursive, sans-serif; font-size: 15px; color: var(--text-sub); font-weight: 700; }
        .diary-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .diary-desc { font-size: 13px; line-height: 1.4; color: var(--text); flex: 1; }
        .diary-amount { font-family: 'Caveat', cursive, sans-serif; font-weight: 700; color: #b91c1c; font-size: 18px; white-space: nowrap; }
        
        .diary-actions { display: flex; gap: 8px; margin-top: 6px; justify-content: flex-end; }
        .btn-action { background: none; border: none; font-size: 12px; cursor: pointer; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
        .btn-edit { color: #0369a1; background: #e0f2fe; }
        .btn-delete { color: #b91c1c; background: #fee2e2; }

        .diary-photo { margin-top: 8px; max-width: 120px; max-height: 120px; border-radius: 6px; border: 1.5px solid #cbd5e1; object-fit: cover; cursor: pointer; }
        .preview-box { display: none; margin-top: 6px; }
        .preview-box img { max-width: 80px; max-height: 80px; border-radius: 6px; border: 1.5px solid #ccc; }

        /* 報告 */
        .report-card { background: var(--card-bg); padding: 12px; border-radius: 10px; border: 1.5px solid #d6d3d1; margin-bottom: 12px; }
        .report-h3 { font-size: 14px; margin: 0 0 8px 0; padding-bottom: 6px; border-bottom: 1.5px dashed #e7e5e4; color: var(--primary); }
        .report-list { list-style: none; padding: 0; margin: 0; }
        .report-list li { padding: 8px 0; border-bottom: 1px dotted #e7e5e4; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
        .report-list-item-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .badge-status { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .total-expense { text-align: right; font-family: 'Caveat', cursive, sans-serif; font-size: 22px; font-weight: 700; color: #b91c1c; margin-top: 10px; }
        
        #syncStatus { font-size: 11px; text-align: center; color: #15803d; margin-bottom: 6px; font-weight: 700; }

        /* 編輯彈窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background: #fffdfa;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
            max-width: 450px;
            border: 2px solid #a8a29e;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .modal-btns { display: flex; gap: 8px; margin-top: 12px; }
        .modal-btns button { flex: 1; padding: 8px; font-weight: 700; cursor: pointer; border-radius: 8px; border: none; }
    </style>
</head>
<body>

<div class="header">
    <select id="unitSelector" onchange="changeUnit()"></select>
    <button class="btn-header" onclick="addUnit()">+ 新地盤</button>
    <button class="btn-del-unit" onclick="deleteCurrentUnit()">❌ 刪除此盤</button>
</div>

<!-- Tab 1: 物資清單 -->
<div id="tab-checklist" class="container content-section active">
    <div id="syncStatus">🔄 雲端連線中...</div>
    
    <div class="custom-add">
        <div style="font-size: 12px; font-weight: 700; color: #854d0e; margin-bottom: 4px;">➕ 臨時追加現場物資</div>
        <div class="custom-add-row">
            <input type="text" id="customItemName" placeholder="輸入物資名稱..." style="flex:1;">
            <button onclick="addCustomItem()" class="btn-header">加入</button>
        </div>
    </div>
    
    <div id="checklistContainer"></div>
</div>

<!-- Tab 2: 現場日誌 -->
<div id="tab-diary" class="container content-section">
    <div class="diary-card">
        <div style="font-size: 14px; font-weight: 700; margin-bottom: 8px;">新增日誌 / 開支</div>
        <div class="diary-form-group">
            <label>工種 / 項目分類</label>
            <select id="diaryCategory">
                <option value="清拆">清拆</option>
                <option value="水電">水電</option>
                <option value="泥水">泥水</option>
                <option value="木工">木工</option>
                <option value="油漆">油漆</option>
                <option value="安裝">安裝</option>
                <option value="員工">員工</option>
                <option value="地盤雜項" selected>地盤雜項</option>
                <option value="驗收">驗收</option>
                <option value="意外問題">意外問題</option>
            </select>
        </div>
        <div class="diary-form-group">
            <label>日期</label>
            <input type="date" id="diaryDate">
        </div>
        <div class="diary-form-group">
            <label>記錄內容 (客戶要求 / 現場進度 / 購買明細)</label>
            <input type="text" id="diaryDesc" placeholder="例如：水喉改暗喉、買飯盒、窗鉸換新">
        </div>
        <div class="diary-form-group">
            <label>金額 $ (純日誌請留空，支出不需打負號)</label>
            <input type="number" id="diaryAmount" placeholder="無費用則留空">
        </div>
        <div class="diary-form-group">
            <label>📷 上載現場相片 / 單據 (選填)</label>
            <input type="file" id="diaryPhotoInput" accept="image/*" onchange="handleImagePreview(event)">
            <div id="previewBox" class="preview-box">
                <img id="imagePreview" src="" alt="預覽">
            </div>
        </div>
        <button onclick="addDiary()" class="btn-submit">儲存記錄至雲端</button>
    </div>
    
    <div id="diaryContainer"></div>
</div>

<!-- Tab 3: 單位報告 -->
<div id="tab-report" class="container content-section">
    <div class="report-card">
        <h3 class="report-h3">🚚 待買 / 待送 / 送現場 物資匯總</h3>
        <ul class="report-list" id="reportMaterials"></ul>
    </div>
    <div class="report-card">
        <h3 class="report-h3">📝 現場日誌與開支總結 (支出無負號)</h3>
        <ul class="report-list" id="reportDiary"></ul>
        <div class="total-expense" id="reportTotal">總開支：$0.0</div>
    </div>
</div>

<!-- 編輯彈窗 Modal -->
<div id="editModal" class="modal-overlay">
    <div class="modal-card">
        <h3 style="margin: 0 0 10px 0; font-size: 15px; color: var(--primary);">✏️ 更改日誌 / 開支記錄</h3>
        <input type="hidden" id="editIndex">
        <div class="diary-form-group">
            <label>分類</label>
            <select id="editCategory">
                <option value="清拆">清拆</option>
                <option value="水電">水電</option>
                <option value="泥水">泥水</option>
                <option value="木工">木工</option>
                <option value="油漆">油漆</option>
                <option value="安裝">安裝</option>
                <option value="員工">員工</option>
                <option value="地盤雜項">地盤雜項</option>
                <option value="驗收">驗收</option>
                <option value="意外問題">意外問題</option>
            </select>
        </div>
        <div class="diary-form-group">
            <label>日期</label>
            <input type="date" id="editDate">
        </div>
        <div class="diary-form-group">
            <label>記錄內容</label>
            <input type="text" id="editDesc">
        </div>
        <div class="diary-form-group">
            <label>金額 $ (直接填寫數字)</label>
            <input type="number" id="editAmount" placeholder="無費用請留空">
        </div>
        <div class="modal-btns">
            <button onclick="closeEditModal()" style="background:#e7e5e4; color:#44403c;">取消</button>
            <button onclick="saveEditDiary()" style="background:#15803d; color:white;">儲存更改</button>
        </div>
    </div>
</div>

<div class="tab-bar">
    <div class="tab active" onclick="switchTab('checklist', this)">📋 物資清單</div>
    <div class="tab" onclick="switchTab('diary', this)">📝 現場日誌</div>
    <div class="tab" onclick="switchTab('report', this)">📊 單位報告</div>
</div>

        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G07', name: '即棄丁腈橡膠手套', desc: '打膠、調和油漆時保持手部潔淨' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G08', name: '慢回彈防噪音工業耳塞', desc: '開鑿敲石屎、電鋸開料時保護聽力' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G09', name: '現場專用急救箱 (含消毒水、止血貼、繃帶)', desc: '割傷砸傷即時清潔包紮' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G10', name: '應急洗眼液及燙傷膏', desc: '異物入眼或接觸化學溶劑即時沖洗' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G11', name: '乾粉滅火筒 (2KG/4KG)', desc: '符合消防規範，預防火災事故' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G12', name: '高光反光螢光背心', desc: '公共大堂通道搬運時提升夜間辨識' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G13', name: '全身式高空防墜雙背安全帶', desc: '搭棚架、窗外安裝冷氣機時合規保命' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G14', name: '防滑橡膠鞋底貼片', desc: '雨天或地盤積水路面防跣' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G15', name: '護膝軟墊', desc: '地台鋪磚、擦地時保護膝蓋關節' },
        { catLetter: 'G', catName: 'G. 安全勞保物資', code: 'G16', name: '危險告示牌 (小心地滑/施工中)', desc: '公眾走廊或門外豎立提醒防意外' }
    ];

    window.onload = () => {
        document.getElementById('diaryDate').valueAsDate = new Date();
    };

    function handleImagePreview(e) {
        const file = e.target.files[0];
        if (!file) {
            base64ImageString = "";
            document.getElementById('previewBox').style.display = 'none';
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                const scaleSize = MAX_WIDTH / img.width;
                const targetWidth = (img.width > MAX_WIDTH) ? MAX_WIDTH : img.width;
                const targetHeight = (img.width > MAX_WIDTH) ? (img.height * scaleSize) : img.height;

                canvas.width = targetWidth;
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                base64ImageString = canvas.toDataURL('image/jpeg', 0.65);

                document.getElementById('imagePreview').src = base64ImageString;
                document.getElementById('previewBox').style.display = 'block';
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    dbRef.on('value', (snapshot) => {
        db = snapshot.val() || {};
        
        if (Object.keys(db).length === 0 && !isInitialized) {
            isInitialized = true;
            let firstUnit = prompt('請輸入第一個地盤名稱 (例如：錦柏苑)：');
            createNewUnit(firstUnit && firstUnit.trim() ? firstUnit.trim() : '示範單位');
            return;
        }

        // 確保每個地盤皆自動套用 ABC 編號規範
        let needsSave = false;
        Object.keys(db).forEach(unitName => {
            if (!db[unitName].checklist || db[unitName].checklist.length < 50 || !db[unitName].checklist[0].code) {
                db[unitName].checklist = defaultMasterList.map(item => ({ ...item, status: 0 }));
                needsSave = true;
            }
        });
        if (needsSave) dbRef.set(db);

        isInitialized = true;
        document.getElementById('syncStatus').innerText = '✅ 雲端已同步 (多人連線)';
        setTimeout(() => document.getElementById('syncStatus').style.display = 'none', 2500);

        if (!db[currentUnit] && Object.keys(db).length > 0) {
            currentUnit = Object.keys(db)[0];
            localStorage.setItem('siteManagerCurrent', currentUnit);
        }

        updateUnitSelector();
        if (currentUnit) renderApp();
    });

    function saveDB() {
        dbRef.set(db); 
        localStorage.setItem('siteManagerCurrent', currentUnit);
    }

    function deleteCurrentUnit() {
        if (!currentUnit) return;
        if (confirm(`確定徹底刪除【${currentUnit}】整個地盤嗎？`)) {
            delete db[currentUnit];
            let remainingUnits = Object.keys(db);
            currentUnit = remainingUnits.length > 0 ? remainingUnits[0] : '';
            saveDB();
            if (!currentUnit) {
                let name = prompt('所有地盤已刪除，請輸入一個新地盤名稱：');
                createNewUnit(name && name.trim() ? name.trim() : '新地盤');
            }
        }
    }

    function createNewUnit(name) {
        if(db[name]) return alert('地盤名稱已存在！');
        db[name] = { 
            checklist: defaultMasterList.map(item => ({ ...item, status: 0 })), 
            diary: [] 
        };
        currentUnit = name;
        saveDB();
    }

    function addUnit() {
        let name = prompt('請輸入新地盤名稱：');
        if(name && name.trim()) createNewUnit(name.trim());
    }

    function changeUnit() {
        currentUnit = document.getElementById('unitSelector').value;
        saveDB();
        renderApp();
    }

    function updateUnitSelector() {
        let sel = document.getElementById('unitSelector');
        sel.innerHTML = '';
        Object.keys(db).forEach(unit => {
            sel.innerHTML += `<option value="${unit}" ${unit === currentUnit ? 'selected' : ''}>${unit}</option>`;
        });
    }

    // 渲染物資清單 (含編號與四態狀態)
    function renderChecklist() {
        if(!db[currentUnit]) return;
        let container = document.getElementById('checklistContainer');
        container.innerHTML = '';
        let list = db[currentUnit].checklist || [];
        
        let currentCat = '';
        list.forEach((item, index) => {
            let catHeader = item.catName || item.cat;
            if(catHeader !== currentCat) {
                container.innerHTML += `<div class="category-title">${catHeader}</div>`;
                currentCat = catHeader;
            }

            let codeDisplay = item.code ? `<span class="item-code">${item.code}</span>` : '';

            container.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-header-row">
                            ${codeDisplay}
                            <div class="item-title">${item.name}</div>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                    <div class="status-group">
                        <button class="status-btn s-0 ${item.status === 0 ? 'active' : ''}" onclick="updateStatus(${index}, 0)">不需</button>
                        <button class="status-btn s-1 ${item.status === 1 ? 'active' : ''}" onclick="updateStatus(${index}, 1)">待買</button>
                        <button class="status-btn s-2 ${item.status === 2 ? 'active' : ''}" onclick="updateStatus(${index}, 2)">待送現場</button>
                        <button class="status-btn s-3 ${item.status === 3 ? 'active' : ''}" onclick="updateStatus(${index}, 3)">送現場</button>
                    </div>
                </div>
            `;
        });
    }

    function updateStatus(index, status) {
        db[currentUnit].checklist[index].status = status;
        saveDB();
    }

    function addCustomItem() {
        let input = document.getElementById('customItemName');
        if(!input.value.trim()) return;
        if(!db[currentUnit].checklist) db[currentUnit].checklist = [];
        
        // 自訂物資以 Z 編號
        let customCount = db[currentUnit].checklist.filter(i => i.catLetter === 'Z').length + 1;
        let code = 'Z' + (customCount < 10 ? '0' + customCount : customCount);

        db[currentUnit].checklist.unshift({ 
            catLetter: 'Z',
            catName: 'Z. 臨時自訂追加', 
            code: code,
            name: input.value.trim(), 
            desc: '現場臨時輸入', 
            status: 1 // 自訂預設為「待買」
        });
        input.value = '';
        saveDB();
    }

    function addDiary() {
        let cat = document.getElementById('diaryCategory').value;
        let date = document.getElementById('diaryDate').value;
        let desc = document.getElementById('diaryDesc').value;
        let amount = document.getElementById('diaryAmount').value;
        if(!desc.trim()) return alert('請填寫記錄內容！');

        if(!db[currentUnit].diary) db[currentUnit].diary = [];
        db[currentUnit].diary.unshift({
            cat: cat,
            date: date,
            desc: desc,
            amount: amount ? Math.abs(parseFloat(amount)) : null, // 確保無負號
            image: base64ImageString || null
        });

        document.getElementById('diaryDesc').value = '';
        document.getElementById('diaryAmount').value = '';
        document.getElementById('diaryPhotoInput').value = '';
        document.getElementById('previewBox').style.display = 'none';
        base64ImageString = "";
        saveDB();
    }

    function deleteDiary(index) {
        if(confirm('確定要刪除這條記錄嗎？')) {
            db[currentUnit].diary.splice(index, 1);
            saveDB();
            renderDiary();
            renderReport();
        }
    }

    function openEditModal(index) {
        let item = db[currentUnit].diary[index];
        if(!item) return;
        document.getElementById('editIndex').value = index;
        document.getElementById('editCategory').value = item.cat || '地盤雜項';
        document.getElementById('editDate').value = item.date;
        document.getElementById('editDesc').value = item.desc;
        document.getElementById('editAmount').value = item.amount !== null && item.amount !== undefined ? Math.abs(item.amount) : '';
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveEditDiary() {
        let index = document.getElementById('editIndex').value;
        let cat = document.getElementById('editCategory').value;
        let date = document.getElementById('editDate').value;
        let desc = document.getElementById('editDesc').value;
        let amount = document.getElementById('editAmount').value;

        if(!desc.trim()) return alert('記錄內容不能為空！');

        db[currentUnit].diary[index].cat = cat;
        db[currentUnit].diary[index].date = date;
        db[currentUnit].diary[index].desc = desc;
        db[currentUnit].diary[index].amount = amount !== '' ? Math.abs(parseFloat(amount)) : null;

        saveDB();
        closeEditModal();
        renderDiary();
        renderReport();
    }

    function renderDiary() {
        if(!db[currentUnit]) return;
        let container = document.getElementById('diaryContainer');
        container.innerHTML = '';
        let diaries = db[currentUnit].diary || [];
        diaries.forEach((d, index) => {
            let isExp = d.amount > 0;
            let catTag = d.cat || '地盤雜項';
            let imgHTML = d.image ? `<img src="${d.image}" class="diary-photo" onclick="window.open(this.src)">` : '';
            
            // 支出不顯示負號
            let amountDisplay = isExp ? `$${d.amount}` : '';

            container.innerHTML += `
                <div class="diary-item ${isExp ? 'expense' : ''}">
                    <div class="diary-header">
                        <span class="tag-cat">${catTag}</span>
                        <span class="diary-date">📅 ${d.date}</span>
                    </div>
                    <div class="diary-body">
                        <div class="diary-desc">${d.desc}</div>
                        ${isExp ? `<div class="diary-amount">${amountDisplay}</div>` : ''}
                    </div>
                    ${imgHTML}
                    <div class="diary-actions">
                        <button class="btn-action btn-edit" onclick="openEditModal(${index})">✏️ 編輯</button>
                        <button class="btn-action btn-delete" onclick="deleteDiary(${index})">🗑️ 刪除</button>
                    </div>
                </div>
            `;
        });
    }

    function renderReport() {
        if(!db[currentUnit]) return;
        let list = db[currentUnit].checklist || [];
        
        // 篩選出非「不需」的物資
        let activeMaterials = list.filter(item => item.status > 0);
        
        let matHTML = '';
        if (activeMaterials.length === 0) {
            matHTML = '<li style="color:#a8a29e; text-align:center;">暫無待買或現場物資</li>';
        } else {
            activeMaterials.forEach(item => {
                let badge = '';
                if(item.status === 1) badge = '<span class="badge-status" style="background:#ffedd5; color:#c2410c;">待買</span>';
                if(item.status === 2) badge = '<span class="badge-status" style="background:#e0f2fe; color:#0369a1;">待送現場</span>';
                if(item.status === 3) badge = '<span class="badge-status" style="background:#dcfce7; color:#15803d;">送現場</span>';
                
                let codeText = item.code ? `[${item.code}] ` : '';
                matHTML += `
                    <li>
                        <div class="report-list-item-header">
                            <span><b>${codeText}</b>${item.name}</span>
                            ${badge}
                        </div>
                    </li>
                `;
            });
        }
        document.getElementById('reportMaterials').innerHTML = matHTML;

        // 日誌與總開支 (無負號)
        let totalExp = 0;
        let dHTML = '';
        let diaries = db[currentUnit].diary || [];
        diaries.forEach((d, index) => {
            if(d.amount > 0) totalExp += d.amount;
            let catTag = d.cat ? `[${d.cat}] ` : '';
            let imgHTML = d.image ? `<div style="margin-top:4px;"><img src="${d.image}" style="max-height:80px; border-radius:6px; border:1px solid #e7e5e4;"></div>` : '';
            let amountDisplay = d.amount ? `$${d.amount}` : '';
            dHTML += `
                <li>
                    <div class="report-list-item-header">
                        <span>${d.date} - ${catTag}${d.desc}</span> 
                        <span style="font-family:'Caveat', cursive, sans-serif; font-size:17px; font-weight:700; color:#b91c1c;">${amountDisplay}</span>
                    </div>
                    ${imgHTML}
                    <div class="diary-actions" style="margin-top: 4px;">
                        <button class="btn-action btn-edit" onclick="openEditModal(${index})">✏️ 更改</button>
                        <button class="btn-action btn-delete" onclick="deleteDiary(${index})">🗑️ 刪除</button>
                    </div>
                </li>`;
        });
        document.getElementById('reportDiary').innerHTML = dHTML || '<li style="color:#a8a29e; text-align:center;">暫無記錄</li>';
        document.getElementById('reportTotal').innerText = `總開支：$${totalExp.toFixed(1)}`;
    }

    function renderApp() {
        renderChecklist();
        renderDiary();
        renderReport();
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        el.classList.add('active');
        if(tabId === 'report') renderReport();
    }
</script>
