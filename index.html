<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工程記錄系統</title>
    
    <!-- 引入報紙風明體與窄身字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Noto+Serif+HK:wght@600;700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 引入 Firebase v8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #eae8e1; /* 報紙底色 */
            --card-bg: #ffffff;
            --text: #000000; 
            --text-sub: #4b4b4b;
            --border: #000000; /* 純黑邊框 */
            
            /* 狀態專用 */
            --color-tobuy: #c2410c;
            --color-tosend: #0369a1;
            --color-onsite: #15803d;
            --color-red: #dc2626;
            --color-orange: #ea580c;
        }
        body { 
            font-family: 'Oswald', 'Noto Sans HK', sans-serif;
            letter-spacing: 0.5px;
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 90px; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 標題明體字 */
        h1, h2, h3, .newspaper-title {
            font-family: 'Noto Serif HK', serif;
            text-transform: uppercase;
        }

        .header { 
            background: var(--card-bg); 
            color: var(--text);
            padding: 10px 15px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            border-bottom: 4px solid var(--border); 
        }
        select, input, button, textarea { 
            font-family: 'Oswald', 'Noto Sans HK', sans-serif;
            font-size: 13px; 
            padding: 6px 8px; 
            border-radius: 0; 
            border: 1px solid var(--border); 
            outline: none;
            background: #fff;
            color: var(--text);
        }
        select:focus, input:focus, textarea:focus {
            box-shadow: 2px 2px 0px var(--border);
        }
        
        .header select { 
            flex: 1; 
            font-weight: 700; 
            border: 2px solid var(--border);
            font-size: 14px;
        }
        .btn-header { background: #000; color: #fff; font-weight: 500; cursor: pointer; border: 2px solid #000; }
        .btn-header:active { background: #333; }
        .btn-del-unit { background: transparent; color: #000; cursor: pointer; border: 1px solid #000; text-decoration: line-through; }
        
        .container { padding: 12px; max-width: 800px; margin: 0 auto; }
        
        /* 底部導覽列 */
        .tab-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            background: #ffffff; 
            display: flex; 
            z-index: 100; 
            border-top: 3px solid var(--border);
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px 0; 
            font-weight: 700; 
            color: var(--text-sub); 
            cursor: pointer; 
            font-size: 12px; 
            border-right: 1px solid var(--border);
        }
        .tab:last-child { border-right: none; }
        .tab.active { 
            color: #fff; 
            background: #000;
        }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 項目卡片 */
        .item-card { 
            background: var(--card-bg); 
            padding: 10px 12px; 
            margin-bottom: 4px; 
            border-bottom: 1px solid #ccc; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }
        .item-info { flex: 1; min-width: 0; }
        .item-header-row { display: flex; align-items: baseline; gap: 8px; }
        .item-title { font-weight: 700; font-size: 14px; }
        .item-desc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        /* 四態狀態按鈕 */
        .status-group { display: flex; gap: 0; flex-shrink: 0; border: 1px solid var(--border); }
        .status-btn { 
            padding: 4px 6px; 
            font-size: 11px; 
            font-weight: 700;
            border: none;
            border-right: 1px solid var(--border); 
            background: white; 
            color: var(--text-sub); 
            cursor: pointer; 
        }
        .status-btn:last-child { border-right: none; }
        .status-btn.s-0.active { background: #000; color: #fff; }
        .status-btn.s-1.active { background: var(--color-tobuy); color: white; }
        .status-btn.s-2.active { background: var(--color-tosend); color: white; }
        .status-btn.s-3.active { background: var(--color-onsite); color: white; }

        /* 追加自訂物資 */
        .custom-add { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            padding: 10px; 
            margin-bottom: 15px; 
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .custom-add-row { display: flex; gap: 8px; margin-top: 8px; }

        /* 表單區域 */
        .diary-card { 
            background: var(--card-bg); 
            padding: 12px; 
            border: 2px solid var(--border); 
            margin-bottom: 15px; 
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .diary-card-title {
            font-family: 'Noto Serif HK', serif;
            font-size: 16px; 
            font-weight: 900; 
            border-bottom: 3px solid #000; 
            padding-bottom: 4px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .diary-form-group { margin-bottom: 10px; }
        .diary-form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 2px; }
        .diary-form-group input, .diary-form-group select, .diary-form-group textarea { width: 100%; box-sizing: border-box; padding: 6px;}
        
        .btn-submit { 
            background: #000; 
            color: white; 
            border: 2px solid #000; 
            width: 100%; 
            font-weight: 700; 
            padding: 8px; 
            cursor: pointer; 
            font-size: 14px; 
            text-transform: uppercase; 
        }

        /* 顏色選擇按鈕 */
        .color-btns-wrapper { display: flex; gap: 6px; margin-top: 4px; }
        .btn-color { flex: 1; padding: 4px; font-size: 11px; font-weight: 700; background: white; border: 1px solid #000; cursor: pointer; text-align: center; }
        .btn-color[data-color="black"].active { background: #000; color: #fff; }
        .btn-color[data-color="orange"] { border-color: var(--color-orange); color: var(--color-orange); }
        .btn-color[data-color="orange"].active { background: var(--color-orange); color: #fff; }
        .btn-color[data-color="red"] { border-color: var(--color-red); color: var(--color-red); }
        .btn-color[data-color="red"].active { background: var(--color-red); color: #fff; }
        
        /* 16 個快速階段按鈕 */
        .quick-btn-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
        .btn-quick {
            background: #fff;
            border: 1px solid var(--border);
            padding: 4px;
            font-size: 11px;
            cursor: pointer;
            color: var(--text);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-quick.active { background: #000; color: white; }

        /* 日誌列表 */
        .diary-item { 
            background: var(--card-bg); 
            padding: 10px; 
            border: 2px solid var(--border); 
            border-left: 6px solid #000; 
            margin-bottom: 8px; 
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .diary-item.expense { border-left-color: var(--color-red); }
        .diary-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .tag-cat { font-size: 11px; font-weight: 700; background:#000; color:#fff; padding:0 4px; }
        .diary-date { font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .diary-body { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .diary-desc { font-size: 13px; line-height: 1.4; color: var(--text); flex: 1; }
        .diary-amount { font-size: 18px; font-weight: 700; }
        .diary-actions { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
        .btn-action { background: none; border: 1px solid var(--border); font-size: 11px; cursor: pointer; padding: 2px 6px; font-weight: 700;}
        
        .preview-box { display: none; margin-top: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
        .preview-box img { max-width: 60px; max-height: 60px; border: 1px solid var(--border); object-fit: cover; cursor: zoom-in; }

        /* 相簿格線 */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }
        .album-item {
            position: relative;
            background: #fff;
            border: 2px solid #000;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }
        .album-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            cursor: zoom-in;
            border-bottom: 1px solid #000;
        }
        .album-item-date {
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            background: #000;
            color: #fff;
            padding: 3px 0;
            letter-spacing: 1px;
        }
        .album-remark {
            width: 100%;
            height: 45px;
            border: none;
            resize: none;
            font-size: 11px;
            padding: 6px;
            box-sizing: border-box;
            background: transparent;
            border-top: 1px solid #000;
        }
        .btn-del-photo {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255,255,255,0.9);
            border: 1px solid #000;
            color: red;
            width: 24px;
            height: 24px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* 全螢幕圖片放大 POPUP Modal */
        #imageEnlargeModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #imageEnlargeModal img {
            max-width: 95vw;
            max-height: 95vh;
            border: 2px solid #fff;
            object-fit: contain;
        }
        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10000;
        }

        /* 報告列表 */
        .report-h3 { font-family: 'Noto Serif HK', serif; font-size: 16px; font-weight: 900; margin: 0 0 10px 0; padding-bottom: 4px; border-bottom: 2px solid var(--text); display: flex; justify-content: space-between; align-items: center; }
        .report-count-badge { font-family: 'Oswald', sans-serif; font-size: 12px; padding: 0 6px; border: 1px solid var(--text); }
        .report-list { list-style: none; padding: 0; margin: 0; }
        .report-list li { padding: 8px 0; border-bottom: 1px solid #d1d5db; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
        .report-list-item-header { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; gap: 10px; }
        .badge-status { font-size: 10px; padding: 0 4px; border: 1px solid currentColor; font-weight: 700; white-space: nowrap; }
        .total-expense { text-align: right; font-size: 22px; font-weight: 700; border-top: 3px solid #000; margin-top: 10px; padding-top: 6px; }
        #syncStatus { font-size: 10px; text-align: center; color: var(--text-sub); margin-bottom: 8px; font-weight: 700; }

        /* 📅 計劃日程表專屬樣式 */
        .schedule-table-wrap {
            overflow-x: auto;
            background: white;
            border: 2px solid var(--border);
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 700px;
            color: #000; 
        }
        .schedule-table th {
            background: #fff;
            color: #000;
            padding: 8px 4px;
            text-align: left;
            border-bottom: 3px solid #000;
            border-right: 1px solid var(--border);
            white-space: nowrap;
            font-weight: 700;
        }
        .schedule-table td {
            padding: 0; 
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
            vertical-align: top;
            color: #000;
        }
        
        .schedule-status-done, .schedule-status-pending {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-height: 50px;
            box-sizing: border-box;
            cursor: pointer;
            font-weight: 700;
        }
        .schedule-status-done { background: #000; color: #fff; }
        .schedule-status-pending { background: transparent; color: var(--text-sub); font-weight: 400; }
        .schedule-status-pending:hover { background: #f3f4f6; }
        
        .editable-remark {
            width: 100%;
            height: 100%;
            min-height: 50px;
            border: none;
            outline: none;
            resize: vertical;
            padding: 6px;
            font-family: inherit;
            font-size: 12px;
            background: transparent;
            box-sizing: border-box;
        }
        .editable-remark:focus { background: #f9fafb; box-shadow: inset 0 0 0 1px #000; }

        /* 編輯彈窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-card {
            background: #fff;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        .modal-btns { display: flex; gap: 8px; margin-top: 15px; }
        .modal-btns button { flex: 1; padding: 8px; font-weight: 700; cursor: pointer; border: 1px solid #000; background: white;}
        .modal-btns button.primary { background: #000; color: white; }
    </style>
</head>
<body>

<div class="header">
    <select id="unitSelector" onchange="changeUnit()"></select>
    <button class="btn-header" onclick="addUnit()">+ 新增</button>
    <button class="btn-del-unit" onclick="deleteCurrentUnit()">刪除地盤</button>
</div>

<!-- Tab 1: 物資清單 -->
<div id="tab-checklist" class="container content-section active">
    <div id="syncStatus">SYSTEM SYNCING...</div>
    
    <div class="custom-add">
        <div class="newspaper-title" style="font-size: 14px; font-weight: 700; margin-bottom: 6px;">+ 臨時追加物資</div>
        <div class="custom-add-row">
            <input type="text" id="customItemName" placeholder="輸入物資名稱..." style="flex:1;">
            <button onclick="addCustomItem()" class="btn-header">加入</button>
        </div>
    </div>
    
    <div id="checklistContainer"></div>
</div>

<!-- Tab 2: 📅 計劃日程表 -->
<div id="tab-schedule" class="container content-section">
    <div class="diary-card">
        <div class="diary-card-title">
            <span>+ 追加日程項目</span>
            <button onclick="clearSchedule()" style="background:transparent; border:1px solid #dc2626; color:#dc2626; padding:2px 8px; font-size:11px; cursor:pointer;">🗑️ 清空全部日程</button>
        </div>
        
        <div class="diary-form-group">
            <label>預測日期 (選填)</label>
            <input type="date" id="schedDate">
        </div>
        
        <div class="diary-form-group">
            <label>快速項目選擇 (點擊即入)</label>
            <div class="quick-btn-group" id="schedProjectBtns">
                <button type="button" class="btn-quick" onclick="setProject('01 設計測量', this)">01 設計測量</button>
                <button type="button" class="btn-quick" onclick="setProject('02 簽約申報', this)">02 簽約申報</button>
                <button type="button" class="btn-quick" onclick="setProject('03 現場清拆', this)">03 現場清拆</button>
                <button type="button" class="btn-quick" onclick="setProject('04 放線定位', this)">04 放線定位</button>
                <button type="button" class="btn-quick" onclick="setProject('05 水電佈線', this)">05 水電佈線</button>
                <button type="button" class="btn-quick" onclick="setProject('06 水喉谷水', this)">06 水喉谷水</button>
                <button type="button" class="btn-quick" onclick="setProject('07 防水塗層', this)">07 防水塗層</button>
                <button type="button" class="btn-quick" onclick="setProject('08 閉水試水', this)">08 閉水試水</button>
                <button type="button" class="btn-quick" onclick="setProject('09 泥水鋪磚', this)">09 泥水鋪磚</button>
                <button type="button" class="btn-quick" onclick="setProject('10 木工打底', this)">10 木工打底</button>
                <button type="button" class="btn-quick" onclick="setProject('11 傢俬覆尺', this)">11 傢俬覆尺</button>
                <button type="button" class="btn-quick" onclick="setProject('12 油漆工程', this)">12 油漆工程</button>
                <button type="button" class="btn-quick" onclick="setProject('13 傢俬組裝', this)">13 傢俬組裝</button>
                <button type="button" class="btn-quick" onclick="setProject('14 五金燈飾', this)">14 五金燈飾</button>
                <button type="button" class="btn-quick" onclick="setProject('15 潔具電器', this)">15 潔具電器</button>
                <button type="button" class="btn-quick" onclick="setProject('16 完工驗收', this)">16 完工驗收</button>
            </div>
            <input type="hidden" id="schedProject" value="">
        </div>

        <div class="diary-form-group">
            <label>工作內容 (選填)</label>
            <input type="text" id="schedContent" placeholder="具體工序細節">
        </div>
        
        <div class="diary-form-group">
            <label>工作提醒 (選填)</label>
            <input type="text" id="schedRemark" placeholder="注意事項...">
            <div class="color-btns-wrapper">
                <input type="hidden" id="schedColor" value="black">
                <button type="button" class="btn-color active" data-color="black" onclick="selectRemarkColor(this, 'black')">預設黑色</button>
                <button type="button" class="btn-color" data-color="orange" onclick="selectRemarkColor(this, 'orange')">橙色醒目</button>
                <button type="button" class="btn-color" data-color="red" onclick="selectRemarkColor(this, 'red')">紅色醒目</button>
            </div>
        </div>

        <button onclick="addScheduleItem()" class="btn-submit" style="margin-top: 8px;">加入日程表</button>
    </div>

    <!-- 計劃日程展示表 -->
    <div class="schedule-table-wrap">
        <table class="schedule-table">
            <thead>
                <tr>
                    <th style="width: 6%; text-align:center;">完?</th>
                    <th style="width: 13%;">日期 (可改)</th>
                    <th style="width: 16%;">項目 (可改)</th>
                    <th style="width: 28%;">工作內容 (點擊可改)</th>
                    <th style="width: 28%;">工作提醒 (點擊可改)</th>
                    <th style="width: 9%; text-align:center; border-right:none;">刪除</th>
                </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
        </table>
    </div>
</div>

<!-- Tab 3: 現場日誌 -->
<div id="tab-diary" class="container content-section">
    <div class="diary-card">
        <div class="diary-card-title">新增日誌 / 開支</div>
        <div class="diary-form-group">
            <label>分類</label>
            <select id="diaryCategory">
                <option value="清拆">清拆</option>
                <option value="水電">水電</option>
                <option value="泥水">泥瓦</option>
                <option value="木工">木工</option>
                <option value="油漆">油漆</option>
                <option value="安裝">安裝</option>
                <option value="軟裝">軟裝</option>
                <option value="員工">員工</option>
                <option value="地盤雜項" selected>地盤雜項</option>
                <option value="驗收">驗收</option>
                <option value="意外問題">意外問題</option>
            </select>
        </div>
        <div class="diary-form-group">
            <label>日期</label>
            <input type="date" id="diaryDate">
        </div>
        <div class="diary-form-group">
            <label>記錄內容</label>
            <input type="text" id="diaryDesc" placeholder="記錄細節...">
        </div>
        <div class="diary-form-group">
            <label>金額 $ (純日誌請留空)</label>
            <input type="number" id="diaryAmount" placeholder="0">
        </div>
        <div class="diary-form-group">
            <label>上載單據/相片 (最多可選 5 張)</label>
            <input type="file" id="diaryPhotoInput" accept="image/*" multiple onchange="handleDiaryImages(event)">
            <div id="previewBox" class="preview-box"></div>
        </div>
        <button onclick="addDiary()" class="btn-submit">儲存記錄</button>
    </div>
    
    <div id="diaryContainer"></div>
</div>

<!-- Tab 4: 📷 現場相簿 -->
<div id="tab-album" class="container content-section">
    <div class="diary-card">
        <div class="diary-card-title">📷 現場相簿 (支援多選)</div>
        <div class="diary-form-group">
            <label>一次可選取 10+ 張相片上載</label>
            <input type="file" id="albumPhotoInput" accept="image/*" multiple onchange="handleAlbumUpload(event)">

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCSRfZdAVh8ADPNtayW5lyDtmE0xDsJXNg",
        authDomain: "gen-lang-client-0208380044.firebaseapp.com",
        databaseURL: "https://gen-lang-client-0208380044-default-rtdb.firebaseio.com",
        projectId: "gen-lang-client-0208380044",
        storageBucket: "gen-lang-client-0208380044.firebasestorage.app",
        messagingSenderId: "17077391191",
        appId: "1:17077391191:web:f167a311052c56bd3d7812"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('siteManagerDB');

    let db = {};
    let currentUnit = localStorage.getItem('siteManagerCurrent') || '';
    let isInitialized = false;
    let diaryImagesTemp = []; 

    // POPUP 點擊放大圖片
    function enlargeImage(src) {
        document.getElementById('enlargedImage').src = src;
        document.getElementById('imageEnlargeModal').style.display = 'flex';
    }

    // 將日期轉換為極簡格式 (M/D 星期)
    function formatShortDate(dateStr) {
        if (!dateStr) return '選擇';
        const d = new Date(dateStr);
        if (isNaN(d)) return dateStr;
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return `${d.getMonth()+1}/${d.getDate()} ${days[d.getDay()]}`;
    }

    function selectRemarkColor(btn, color) {
        document.getElementById('schedColor').value = color;
        document.querySelectorAll('.color-btns-wrapper .btn-color').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function setProject(val, btn) {
        document.getElementById('schedProject').value = val;
        document.querySelectorAll('#schedProjectBtns .btn-quick').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    window.onload = () => {
        document.getElementById('diaryDate').valueAsDate = new Date();
    };

    // 日誌上載 (最多 5 張)
    async function handleDiaryImages(e) {
        const files = e.target.files;
        if (!files) return;
        let previewBox = document.getElementById('previewBox');
        previewBox.innerHTML = '';
        diaryImagesTemp = [];
        
        let len = Math.min(files.length, 5); 
        for(let i = 0; i < len; i++){
            let b64 = await compressImage(files[i], 800, 0.65);
            diaryImagesTemp.push(b64);
            previewBox.innerHTML += `<img src="${b64}" onclick="enlargeImage('${b64}')">`;
        }
        if(len > 0) previewBox.style.display = 'flex';
    }

    // 現場相簿批量上載
    async function handleAlbumUpload(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        
        let status = document.getElementById('albumUploadStatus');
        status.innerText = `正在處理 ${files.length} 張相片，請稍候...`;

        if(!db[currentUnit].album) db[currentUnit].album = [];

        for(let i = 0; i < files.length; i++){
            let b64 = await compressImage(files[i], 600, 0.5);
            db[currentUnit].album.unshift({
                date: new Date().toLocaleDateString('zh-HK'),
                image: b64,
                remark: ''
            });
        }
        
        saveDB();
        renderAlbum();
        status.innerText = '✅ 上載完成';
        setTimeout(() => status.innerText = '', 2000);
        e.target.value = '';
    }

    // 共用圖片壓縮
    function compressImage(file, maxWidth, quality) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const scaleSize = maxWidth / img.width;
                    const targetWidth = img.width > maxWidth ? maxWidth : img.width;
                    const targetHeight = img.width > maxWidth ? img.height * scaleSize : img.height;

                    canvas.width = targetWidth;
                    canvas.height = targetHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    dbRef.on('value', (snapshot) => {
        db = snapshot.val() || {};
        
        if (Object.keys(db).length === 0 && !isInitialized) {
            isInitialized = true;
            let firstUnit = prompt('請輸入第一個地盤名稱：');
            createNewUnit(firstUnit && firstUnit.trim() ? firstUnit.trim() : 'Project-01');
            return;
        }

        let needsSave = false;
        Object.keys(db).forEach(unitName => {
            if (!db[unitName].checklist) { db[unitName].checklist = []; needsSave = true; }
            if (!db[unitName].schedule) { db[unitName].schedule = []; needsSave = true; }
            if (!db[unitName].album) { db[unitName].album = []; needsSave = true; }
            if (!db[unitName].diary) { db[unitName].diary = []; needsSave = true; }
        });
        if (needsSave) dbRef.set(db);

        isInitialized = true;
        document.getElementById('syncStatus').innerText = 'SYNCED.';
        setTimeout(() => document.getElementById('syncStatus').style.display = 'none', 2500);

        if (!db[currentUnit] && Object.keys(db).length > 0) {
            currentUnit = Object.keys(db)[0];
            localStorage.setItem('siteManagerCurrent', currentUnit);
        }

        updateUnitSelector();
        if (currentUnit) renderApp();
    });

    function saveDB() {
        dbRef.set(db); 
        localStorage.setItem('siteManagerCurrent', currentUnit);
    }

    function deleteCurrentUnit() {
        if (!currentUnit) return;
        if (confirm(`確定刪除【${currentUnit}】？此操作無法復原。`)) {
            delete db[currentUnit];
            let remainingUnits = Object.keys(db);
            currentUnit = remainingUnits.length > 0 ? remainingUnits[0] : '';
            saveDB();
            if (!currentUnit) {
                createNewUnit('Project-01');
            } else {
                updateUnitSelector();
                renderApp();
            }
        }
    }

    function createNewUnit(name) {
        if(db[name]) return alert('名稱已存在');
        db[name] = { 
            _init: Date.now(), 
            checklist: [], 
            diary: [],
            schedule: [],
            album: []
        };
        currentUnit = name;
        saveDB();
        updateUnitSelector();
        renderApp();
    }

    function addUnit() {
        let name = prompt('輸入新地盤名稱：');
        if(name && name.trim()) createNewUnit(name.trim());
    }

    function changeUnit() {
        currentUnit = document.getElementById('unitSelector').value;
        saveDB();
        renderApp();
    }

    function updateUnitSelector() {
        let sel = document.getElementById('unitSelector');
        sel.innerHTML = '';
        Object.keys(db).forEach(unit => {
            sel.innerHTML += `<option value="${unit}" ${unit === currentUnit ? 'selected' : ''}>${unit}</option>`;
        });
    }

    // --- 1. 物資清單 ---
    function renderChecklist() {
        if(!db[currentUnit]) return;
        let container = document.getElementById('checklistContainer');
        container.innerHTML = '';
        let list = db[currentUnit].checklist || [];
        
        if(list.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-sub);">暫無物資，請由上方新增。</div>';
            return;
        }

        list.forEach((item, index) => {
            container.innerHTML += `
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-header-row">
                            <span class="item-code">${item.code || '-'}</span>
                            <div class="item-title">${item.name}</div>
                        </div>
                        <div class="item-desc">${item.desc || ''}</div>
                    </div>
                    <div class="status-group">
                        <button class="status-btn s-0 ${item.status === 0 ? 'active' : ''}" onclick="updateStatus(${index}, 0)">不需</button>
                        <button class="status-btn s-1 ${item.status === 1 ? 'active' : ''}" onclick="updateStatus(${index}, 1)">待買</button>
                        <button class="status-btn s-2 ${item.status === 2 ? 'active' : ''}" onclick="updateStatus(${index}, 2)">待送現場</button>
                        <button class="status-btn s-3 ${item.status === 3 ? 'active' : ''}" onclick="updateStatus(${index}, 3)">送現場</button>
                    </div>
                </div>
            `;
        });
    }

    function updateStatus(index, status) {
        db[currentUnit].checklist[index].status = status;
        saveDB();
    }

    function addCustomItem() {
        let input = document.getElementById('customItemName');
        if(!input.value.trim()) return;
        if(!db[currentUnit].checklist) db[currentUnit].checklist = [];
        
        let code = 'M' + (db[currentUnit].checklist.length + 1).toString().padStart(2, '0');

        db[currentUnit].checklist.push({ 
            catLetter: 'M',
            catName: 'M. 自訂物資', 
            code: code,
            name: input.value.trim(), 
            desc: '', 
            status: 1
        });
        input.value = '';
        saveDB();
        renderChecklist();
        renderReport();
    }

    // --- 2. 📅 計劃日程表 ---
    function renderSchedule() {
        if(!db[currentUnit]) return;
        let tbody = document.getElementById('scheduleTableBody');
        tbody.innerHTML = '';
        let list = db[currentUnit].schedule || [];

        if(list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px; font-weight:700;">暫無日程項目，請由上方新增。</td></tr>';
            return;
        }

        list.forEach((item, index) => {
            let isDone = item.done;
            let statusBtn = isDone ? 
                `<div class="schedule-status-done" onclick="toggleScheduleDone(${index})">完</div>` : 
                `<div class="schedule-status-pending" onclick="toggleScheduleDone(${index})">未完</div>`;

            let displayDate = formatShortDate(item.date);

            let colorHex = '#000000';
            if (item.color === 'red') colorHex = 'var(--color-red)';
            if (item.color === 'orange') colorHex = 'var(--color-orange)';
            let fw = (colorHex !== '#000000') ? '700' : '400';

            tbody.innerHTML += `
                <tr>
                    <td style="padding: 0; vertical-align: middle;">
                        ${statusBtn}
                    </td>
                    <td style="padding: 0; position: relative;">
                        <div style="padding: 15px 2px; font-family:'Oswald',sans-serif; font-size:13px; font-weight:700; text-align:center;">${displayDate}</div>
                        <input type="date" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.01; cursor: pointer;" value="${item.date || ''}" onchange="updateScheduleDate(${index}, this.value)">
                    </td>
                    <td style="padding: 0;">
                        <textarea class="editable-remark" style="font-weight:700;" onchange="updateScheduleProject(${index}, this.value)" placeholder="項目...">${item.project || ''}</textarea>
                    </td>
                    <td style="padding: 0;">
                        <textarea class="editable-remark" onchange="updateScheduleContent(${index}, this.value)" placeholder="輸入內容...">${item.content || ''}</textarea>
                    </td>
                    <td style="padding: 0;">
                        <textarea class="editable-remark" style="color: ${colorHex}; font-weight: ${fw};" onchange="updateScheduleRemark(${index}, this.value)" placeholder="輸入備註...">${item.remark || ''}</textarea>
                    </td>
                    <td style="text-align:center; padding: 10px 4px; border-right:none; vertical-align:middle;">
                        <button onclick="deleteScheduleItem(${index})" style="background:none; border:none; color:red; cursor:pointer; font-size:16px;">✕</button>
                    </td>
                </tr>
            `;
        });
    }

    function clearSchedule() {
        if(confirm('確定要清空此地盤的所有日程嗎？')) {
            db[currentUnit].schedule = [];
            saveDB();
            renderSchedule();
        }
    }

    function toggleScheduleDone(index) {
        db[currentUnit].schedule[index].done = !db[currentUnit].schedule[index].done;
        saveDB();
        renderSchedule();
    }

    function updateScheduleDate(index, newValue) {
        db[currentUnit].schedule[index].date = newValue;
        saveDB();
        renderSchedule();
    }
    
    function updateScheduleProject(index, newValue) {
        db[currentUnit].schedule[index].project = newValue;
        saveDB();
    }

    function updateScheduleContent(index, newValue) {
        db[currentUnit].schedule[index].content = newValue;
        saveDB();
    }

    function updateScheduleRemark(index, newValue) {
        db[currentUnit].schedule[index].remark = newValue;
        saveDB();
    }

    function addScheduleItem() {
        let date = document.getElementById('schedDate').value;
        let project = document.getElementById('schedProject').value.trim();
        let content = document.getElementById('schedContent').value.trim();
        let remark = document.getElementById('schedRemark').value.trim();
        let color = document.getElementById('schedColor').value;

        if(!project) return alert('必須選擇或輸入項目！');

        if(!db[currentUnit].schedule) db[currentUnit].schedule = [];
        db[currentUnit].schedule.push({
            date: date,
            done: false,
            project: project,
            content: content,
            remark: remark,
            color: color
        });

        document.getElementById('schedDate').value = '';
        document.getElementById('schedProject').value = '';
        document.getElementById('schedContent').value = '';
        document.getElementById('schedRemark').value = '';
        
        document.querySelectorAll('#schedProjectBtns .btn-quick').forEach(b => b.classList.remove('active'));
        selectRemarkColor(document.querySelector('.btn-color[data-color="black"]'), 'black');

        saveDB();
        renderSchedule();
    }

    function deleteScheduleItem(index) {
        if(confirm('刪除此日程?')) {
            db[currentUnit].schedule.splice(index, 1);
            saveDB();
            renderSchedule();
        }
    }

    // --- 3. 現場日誌 ---
    function addDiary() {
        let cat = document.getElementById('diaryCategory').value;
        let date = document.getElementById('diaryDate').value;
        let desc = document.getElementById('diaryDesc').value;
        let amount = document.getElementById('diaryAmount').value;
        if(!desc.trim()) return alert('輸入記錄');

        if(!db[currentUnit].diary) db[currentUnit].diary = [];
        db[currentUnit].diary.unshift({
            cat: cat,
            date: date,
            desc: desc,
            amount: amount ? Math.abs(parseFloat(amount)) : null,
            images: diaryImagesTemp.length > 0 ? [...diaryImagesTemp] : null
        });

        document.getElementById('diaryDesc').value = '';
        document.getElementById('diaryAmount').value = '';
        document.getElementById('diaryPhotoInput').value = '';
        document.getElementById('previewBox').style.display = 'none';
        diaryImagesTemp = [];
        saveDB();
        renderDiary();
        renderReport();
    }

    function deleteDiary(index) {
        if(confirm('刪除此日誌?')) {
            db[currentUnit].diary.splice(index, 1);
            saveDB();
            renderDiary();
            renderReport();
        }
    }

    function openEditModal(index) {
        let item = db[currentUnit].diary[index];
        if(!item) return;
        document.getElementById('editIndex').value = index;
        document.getElementById('editCategory').value = item.cat || '地盤雜項';
        document.getElementById('editDate').value = item.date;
        document.getElementById('editDesc').value = item.desc;
        document.getElementById('editAmount').value = item.amount !== null && item.amount !== undefined ? Math.abs(item.amount) : '';
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveEditDiary() {
        let index = document.getElementById('editIndex').value;
        let cat = document.getElementById('editCategory').value;
        let date = document.getElementById('editDate').value;
        let desc = document.getElementById('editDesc').value;
        let amount = document.getElementById('editAmount').value;

        if(!desc.trim()) return;

        db[currentUnit].diary[index].cat = cat;
        db[currentUnit].diary[index].date = date;
        db[currentUnit].diary[index].desc = desc;
        db[currentUnit].diary[index].amount = amount !== '' ? Math.abs(parseFloat(amount)) : null;

        saveDB();
        closeEditModal();
        renderDiary();
        renderReport();
    }

    function renderDiary() {
        if(!db[currentUnit]) return;
        let container = document.getElementById('diaryContainer');
        container.innerHTML = '';
        let diaries = db[currentUnit].diary || [];
        diaries.forEach((d, index) => {
            let isExp = d.amount > 0;
            let catTag = d.cat || '雜項';
            let amountDisplay = isExp ? `$${d.amount}` : '';
            
            let imgHTML = '';
            let imgs = d.images || (d.image ? [d.image] : []);
            if(imgs.length > 0) {
                imgHTML = '<div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">';
                imgs.forEach(src => {
                    imgHTML += `<img src="${src}" onclick="enlargeImage('${src}')" style="width:70px; height:70px; object-fit:cover; border:1px solid #000; cursor:zoom-in;">`;
                });
                imgHTML += '</div>';
            }

            container.innerHTML += `
                <div class="diary-item ${isExp ? 'expense' : ''}">
                    <div class="diary-header">
                        <span class="tag-cat">${catTag}</span>
                        <span class="diary-date">${d.date}</span>
                    </div>
                    <div class="diary-body">
                        <div class="diary-desc">${d.desc}</div>
                        ${isExp ? `<div class="diary-amount">${amountDisplay}</div>` : ''}
                    </div>
                    ${imgHTML}
                    <div class="diary-actions">
                        <button class="btn-action" onclick="openEditModal(${index})">修改</button>
                        <button class="btn-action" style="color:red; border-color:red;" onclick="deleteDiary(${index})">刪除</button>
                    </div>
                </div>
            `;
        });
    }

    // --- 4. 現場相簿 ---
    function renderAlbum() {
        if(!db[currentUnit]) return;
        let container = document.getElementById('albumGallery');
        container.innerHTML = '';
        let photos = db[currentUnit].album || [];
        
        photos.forEach((p, index) => {
            container.innerHTML += `
                <div class="album-item">
                    <button class="btn-del-photo" onclick="deleteAlbumPhoto(${index})">✕</button>
                    <img src="${p.image}" onclick="enlargeImage('${p.image}')">
                    <div class="album-item-date">${p.date}</div>
                    <textarea class="album-remark" placeholder="輸入備註..." onchange="updateAlbumRemark(${index}, this.value)">${p.remark || ''}</textarea>
                </div>
            `;
        });
    }

    function updateAlbumRemark(index, val) {
        db[currentUnit].album[index].remark = val;
        saveDB();
    }

    function deleteAlbumPhoto(index) {
        if(confirm('確定刪除此相片？')) {
            db[currentUnit].album.splice(index, 1);
            saveDB();
            renderAlbum();
        }
    }

    // --- 5. 單位報告 ---
    function renderReport() {
        if(!db[currentUnit]) return;
        let list = db[currentUnit].checklist || [];
        
        let toBuyList = list.filter(item => item.status === 1);
        let toSendList = list.filter(item => item.status === 2);
        let onSiteList = list.filter(item => item.status === 3);

        document.getElementById('countToBuy').innerText = toBuyList.length;
        document.getElementById('reportListToBuy').innerHTML = toBuyList.length ? toBuyList.map(item => `
            <li>
                <div class="report-list-item-header">
                    <span><b style="font-family:'Oswald',sans-serif; margin-right:6px; color:var(--text-sub);">${item.code || ''}</b>${item.name}</span>
                </div>
            </li>
        `).join('') : '<li style="color:var(--text-sub); text-align:center;">-</li>';

        document.getElementById('countToSend').innerText = toSendList.length;
        document.getElementById('reportListToSend').innerHTML = toSendList.length ? toSendList.map(item => `
            <li>
                <div class="report-list-item-header">
                    <span><b style="font-family:'Oswald',sans-serif; margin-right:6px; color:var(--text-sub);">${item.code || ''}</b>${item.name}</span>
                </div>
            </li>
        `).join('') : '<li style="color:var(--text-sub); text-align:center;">-</li>';

        document.getElementById('countOnSite').innerText = onSiteList.length;
        document.getElementById('reportListOnSite').innerHTML = onSiteList.length ? onSiteList.map(item => `
            <li>
                <div class="report-list-item-header">
                    <span><b style="font-family:'Oswald',sans-serif; margin-right:6px; color:var(--text-sub);">${item.code || ''}</b>${item.name}</span>
                </div>
            </li>
        `).join('') : '<li style="color:var(--text-sub); text-align:center;">-</li>';

        let totalExp = 0;
        let dHTML = '';
        let diaries = db[currentUnit].diary || [];
        diaries.forEach((d, index) => {
            if(d.amount > 0) totalExp += d.amount;
            let amountDisplay = d.amount ? `$${d.amount}` : '';
            dHTML += `
                <li>
                    <div class="report-list-item-header">
                        <span style="flex:1;">
                            <div style="font-family:'Oswald',sans-serif; font-size:12px; color:var(--text-sub);">${d.date} [${d.cat || ''}]</div>
                            <div style="margin-top:2px;">${d.desc}</div>
                        </span> 
                        <span style="font-family:'Oswald',sans-serif; font-size:16px; font-weight:700; color:#000;">${amountDisplay}</span>
                    </div>
                </li>`;
        });
        document.getElementById('reportDiary').innerHTML = dHTML || '<li style="color:var(--text-sub); text-align:center;">-</li>';
        document.getElementById('reportTotal').innerText = `TOTAL: $${totalExp.toFixed(1)}`;
    }

    function renderApp() {
        renderChecklist();
        renderSchedule();
        renderDiary();
        renderAlbum();
        renderReport();
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        el.classList.add('active');
        if(tabId === 'report') renderReport();
        if(tabId === 'schedule') renderSchedule();
        if(tabId === 'album') renderAlbum();
    }
</script>
</body>
</html>
