    <style>
        :root { 
            --bg: #eae8e1; 
            --card-bg: #ffffff;
            --text: #000000; 
            --text-sub: #4b4b4b;
            --border: #000000;

            --color-tosend: #0369a1;

        body { 
            font-family: 'Oswald', 'Noto Sans HK', sans-serif;
            letter-spacing: 0.3px;
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 60px; 
            -webkit-tap-highlight-color: transparent;
        }
        
        h1, h2, h3, .newspaper-title { font-family: 'Noto Serif HK', serif; text-transform: uppercase; }

        .header { 
            background: var(--card-bg); 
            padding: 6px 8px; 
            position: sticky; 
            top: 0;

            display: flex; 
            gap: 6px; 
            align-items: center; 
            border-bottom: 3px solid var(--border); 
        }
        .header select { 
            flex: 1; 
            font-weight: 700; 
            border: 2px solid var(--border);

            color: #000; 
            background: #fff;
            padding: 2px 6px;
            height: 40px; 
            outline: none;
            appearance: auto; 
            -webkit-appearance: menulist;
