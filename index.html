<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工記錄系統</title>
    
    <!-- 引入報紙風明體與窄身字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Noto+Serif+HK:wght@600;700;900&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- 引入 Firebase v8 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg: #eae8e1; /* 報紙底色 */
            --card-bg: #ffffff;
            --text: #000000; 
            --text-sub: #4b4b4b;
            --border: #000000; /* 純黑邊框 */
            
            /* 狀態專用 */
            --color-tobuy: #c2410c;
            --color-tosend: #0369a1;
            --color-onsite: #15803d;
            --color-red: #dc2626;
            --color-orange: #ea580c;
        }
        body { 
            font-family: 'Oswald', 'Noto Sans HK', sans-serif;
            letter-spacing: 0.5px;
            margin: 0; 
            padding: 0; 
            background: var(--bg); 
            color: var(--text); 
            padding-bottom: 90px; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 標題明體字 */
        h1, h2, h3, .newspaper-title {
            font-family: 'Noto Serif HK', serif;
            text-transform: uppercase;
        }

        .header { 
            background: var(--card-bg); 
            color: var(--text);
            padding: 10px 15px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            border-bottom: 4px solid var(--border); 
        }
        select, input, button, textarea { 
            font-family: 'Oswald', 'Noto Sans HK', sans-serif;
            font-size: 13px; 
            padding: 6px 8px; 
            border-radius: 0; 
            border: 1px solid var(--border); 
            outline: none;
            background: #fff;
            color: var(--text);
        }
        select:focus, input:focus, textarea:focus {
            box-shadow: 2px 2px 0px var(--border);
        }
        
        .header select { 
            flex: 1; 
            font-weight: 700; 
            border: 2px solid var(--border);
            font-size: 14px;
        }
        .btn-header { background: #000; color: #fff; font-weight: 500; cursor: pointer; border: 2px solid #000; }
        .btn-header:active { background: #333; }
        .btn-del-unit { background: transparent; color: #000; cursor: pointer; border: 1px solid #000; text-decoration: line-through; }
        
        .container { padding: 12px; max-width: 800px; margin: 0 auto; }
        
        /* 底部導覽列 */
        .tab-bar { 
            position: fixed; 
            bottom: 0; 
            left: 0;
            width: 100%; 
            background: #ffffff; 
            display: flex; 
            z-index: 100; 
            border-top: 3px solid var(--border);
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px 0; 
            font-weight: 700; 
            color: var(--text-sub); 
            cursor: pointer; 
            font-size: 12px; 
            border-right: 1px solid var(--border);
        }
        .tab:last-child { border-right: none; }
        .tab.active { 
            color: #fff; 
            background: #000;
        }
        .content-section { display: none; }
        .content-section.active { display: block; }

        /* 項目卡片 */
        .item-card { 
            background: var(--card-bg); 
            padding: 10px 12px; 
            margin-bottom: 4px; 
            border-bottom: 1px solid #ccc; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }
        .item-info { flex: 1; min-width: 0; }
        .item-header-row { display: flex; align-items: baseline; gap: 8px; }
        .item-title { font-weight: 700; font-size: 14px; }
        .item-desc { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        /* 四態狀態按鈕 */
        .status-group { display: flex; gap: 0; flex-shrink: 0; border: 1px solid var(--border); }
        .status-btn { 
            padding: 4px 6px; 
            font-size: 11px; 
            font-weight: 700;
            border: none;
            border-right: 1px solid var(--border); 
            background: white; 
            color: var(--text-sub); 
            cursor: pointer; 
        }
        .status-btn:last-child { border-right: none; }
        .status-btn.s-0.active { background: #000; color: #fff; }
        .status-btn.s-1.active { background: var(--color-tobuy); color: white; }
        .status-btn.s-2.active { background: var(--color-tosend); color: white; }
        .status-btn.s-3.active { background: var(--color-onsite); color: white; }

        /* 追加自訂物資 */
        .custom-add { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            padding: 10px; 
            margin-bottom: 15px; 
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .custom-add-row { display: flex; gap: 8px; margin-top: 8px; }

        /* 表單區域 */
        .diary-card { 
            background: var(--card-bg); 
            padding: 12px; 
            border: 2px solid var(--border); 
            margin-bottom: 15px; 
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .diary-card-title {
            font-family: 'Noto Serif HK', serif;
            font-size: 16px; 
            font-weight: 900; 
            border-bottom: 3px solid #000; 
            padding-bottom: 4px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .diary-form-group { margin-bottom: 10px; }
        .diary-form-group label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sub); margin-bottom: 2px; }
        .diary-form-group input, .diary-form-group select, .diary-form-group textarea { width: 100%; box-sizing: border-box; padding: 6px;}
